# Senior Time
- type: loadoutEffectGroup
  id: SeniorOfficer
  effects:
  # - !type:JobRequirementLoadoutEffect # DV - Remove Specific Role Timers
  #   requirement:
  #     !type:RoleTimeRequirement
  #     role: JobWarden
  #     time: 6h
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Security
      time: 60h

# Head
- type: loadout
  id: SecurityHelmet
  equipment:
    head: ClothingHeadHelmetBasic

- type: loadout
  id: SecurityHat
  equipment:
    head: ClothingHeadHatSecsoft

- type: loadout
  id: SecurityBeret
  equipment:
    head: ClothingHeadHatBeretSecurity

# Jumpsuit
- type: loadout
  id: SecurityJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitSec
  groupBy: "jumpsuit" #DeltaV

- type: loadout
  id: SecurityJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtSec
  groupBy: "jumpskirt" #DeltaV

- type: loadout
  id: SecurityJumpsuitGrey
  equipment:
    jumpsuit: ClothingUniformJumpsuitSecGrey
  groupBy: "jumpsuit" #DeltaV

- type: loadout
  id: SecurityJumpskirtGrey
  equipment:
    jumpsuit: ClothingUniformJumpskirtSecGrey
  groupBy: "jumpskirt" #DeltaV

- type: loadout
  id: SeniorOfficerJumpsuit
  effects:
  - !type:GroupLoadoutEffect
    proto: SeniorOfficer
  equipment:
    jumpsuit: ClothingUniformJumpsuitSeniorOfficer
  groupBy: "jumpsuit" #DeltaV

- type: loadout
