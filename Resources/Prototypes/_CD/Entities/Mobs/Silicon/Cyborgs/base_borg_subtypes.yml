# use these base subtypes to avoid some boilerplate

- type: entity
  abstract: true
  id: BorgSubtypeBase
  name: borg subtype base
  categories: [ "BorgSubtype" ]
  components:
    - type: BorgSubtypeDefinition
      # Visuals
      layerData:
        - state: borg
          map: [ "enum.BorgVisualLayers.Body", "movement" ]
        - state: borg_e
          map: [ "enum.BorgVisualLayers.Light" ]
          shader: unshaded
          visible: false
        - state: borg_l
          shader: unshaded
          map: [ "light","enum.BorgVisualLayers.LightStatus" ]
          visible: false

      spriteBodyState: borg
      spriteHasMindState: borg_e
      # if rsi has a specific no mind state sprite, use that instead (i.e. borg_e_r)
      spriteNoMindState: borg_e
      footstepCollection:
        collection: FootstepBorg

- type: entity
  abstract: true
  id: MovingSpriteBorgSubtype
  name: borg subtype base w/ moving animations
  categories: [ "BorgSubtype" ]
  components:
    - type: BorgSubtypeDefinition
      # Visuals
      layerData:
        - state: borg
          map: [ "enum.BorgVisualLayers.Body", "movement" ]
        - state: borg_e
          map: [ "enum.BorgVisualLayers.Light" ]
          shader: unshaded
          visible: false
        - state: borg_l
          shader: unshaded
          map: [ "light","enum.BorgVisualLayers.LightStatus" ]
          visible: false
      spriteBodyState: borg
      spriteHasMindState: borg_e
      # if rsi has a specific no mind state sprite, use that instead (i.e. borg_e_r)
      spriteNoMindState: borg_e
      spriteBodyMovementState: borg_moving # Only difference is that this is defined
      footstepCollection:
        collection: FootstepBorg

# generic
- type: entity
  parent: BorgSubtypeBase
  abstract: true
  id: BorgGenericSubtypeBase
  name: borg generic subtype
  components:
    - type: BorgSubtypeDefinition
      parentType: generic
      dummyPrototype: BorgChassisGenericDefault

