- type: entity
  name: paladin shield
  parent: BaseItem
  id: PaladinShield
  description: A shield for a true paladin! Good at deflecting hits with swords and absorbing the impact from bats, but not much else.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
      size: Ginormous
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: Blocking
      # Begin DeltaV
      passiveBlockModifier:
        armor:
          Blunt: DamageTider
          Slash: DamagePistol
          Piercing: DamageTider
          Heat: DamageTider
      activeBlockModifier:
        armor:
          Blunt: DamagePistol
          Slash: DamageRifle
          Piercing: DamagePistol
          Heat: DamagePistol
      # End DeltaV
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 14 #Bonk!
      soundHit:
        path: "/Audio/Weapons/smash.ogg"
    - type: Damageable
      damageContainer: Shield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 160
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 120
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetPlasteel:
                  min: 4
                  max: 13
                SheetSteel:
                  min: 5
                  max: 13

- type: entity
  name: paladin greatshield
  parent: PaladinShield
  id: PaladinShieldGreat
  description: You're up against the wall and I! AM! THE! FUCKING! WALL!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
    - type: Blocking
      # Begin DeltaV
      passiveBlockModifier:
        armor:
          Blunt: DamagePistol
          Slash: DamagePistol
          Piercing: DamagePistol
          Heat: DamagePistol
      activeBlockModifier:
        armor: #Insanely high resist because normal shields suck when raising. This is a WALL.
          Blunt: DamageSniper
          Slash: DamageSniper
          Piercing: DamageSniper
          Heat: DamagePistol # Achilles Heel
      # End DeltaV
    - type: MeleeWeapon
      attackRate: 0.50 # Large and heavy but god help you if someone hits you with this thing.
      damage:
        types:
          Blunt: 20    
    - type: ClothingSpeedModifier
      walkModifier: 0.7
      sprintModifier: 0.5
    - type: HeldSpeedModifier
    - type: Damageable
      damageContainer: Shield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 250 #Combined with damage resistances, IF raised, can tank 6 lector magdumps before finally breaking. You will STAM CRIT before then. If just held, or a laser is used it'll function like a normal shield more or less.
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetPlasteel:
                  min: 6
                  max: 20
                SheetSteel:
                  min: 4
                  max: 15
                SheetGlass:
                  min: 2
                  max: 3

