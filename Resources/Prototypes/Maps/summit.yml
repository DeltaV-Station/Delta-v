- type: gameMap
  id: Summit
  mapName: 'Summit'
  mapPath: /Maps/summit.yml
  minPlayers: 40
  stations:
    Summit:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Summit Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DV'
        - type: StationPlanetSpawner
          planet: GlacierSurface
          gridPath: /Maps/_DV/Nonstations/glacier_surface_outpost.yml
        - type: StationJobs
          availableJobs:
          #civilian
            Passenger: [ -1, -1 ]
            Boxer: [ 2, 2 ]
          #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ChiefJustice: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            StationAi: [ 1, 1 ]
          #engineering
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 4, 6 ]
            TechnicalAssistant: [ 2, 3 ]
          #justice
            Clerk: [ 1, 1 ]
            Lawyer: [ 1, 2 ]
            Prosecutor: [ 1, 1 ]
          #medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 5 ]
            MedicalIntern: [ 2, 3 ]
            Paramedic: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
          #security
            Brigmedic: [ 1, 1 ]
            Detective: [ 1, 2 ]
            Prisoner: [ 2, 3 ]
            PrisonGuard: [ 2, 2 ]
            SecurityOfficer: [ 5, 7 ]
            SecurityCadet: [ 2, 3 ]
            Warden: [ 1, 1 ]
          #service
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Clown: [ 1, 1 ]
            Janitor: [ 2, 3 ]
            Mime: [ 1, 1 ]
            Musician: [ 2, 2 ]
            Reporter: [ 2, 2 ]
            ServiceWorker: [ 3, 4 ]
          #science
            Borg: [ 2, 3 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ForensicMantis: [ 1, 1 ]
            ResearchAssistant: [ 2, 4 ]
            Scientist: [ 3, 5 ]
            Roboticist: [ 1, 2 ]
          #supply
            CargoAssistant: [ 1, 2 ]
            CargoTechnician: [ 2, 3 ]
            Courier: [ 1, 2 ]
            SalvageSpecialist: [ 3, 3 ]