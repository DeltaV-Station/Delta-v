# Academy Summary
# _______________________
# Academy is a Learning and Epistemics(Science) focused station with these notable things to keep...
# Fraternity/Sorority house for dorms; lecture hall; public observation of some department activities.
# Epistemics is featured in the center of station around a park and given ample space at the expense of other depts.
#   Robotics has public observation rooms for building and their own surgery. Hospital beds are for IPCs.
#   Artifact is split east/west to ensure an explosion on one side does not stop research.
#   Anomaly has a dedicated room for "treating" afflicted crew.
#   Mantis has access to an "Epistemics Brig" (shared access with Security/Law)
# Engineering has a PA offering both Tesla and Singularity.
#   Atmos is deliberately split inside/outside; the small inside incentivises them to do things outside.
# Virology is split and sealed from the rest of the station with security checkpoints to control movement.
#   Movement through checkpoints is given command access.
#   Virology has a dedicated disposal and atmos network with intention to restrict outbreaks.
# Cargo has a cute cafe across its reception. Crew can get a drink or cake while they watch the shuttle come and go.
#

- type: gameMap
  id: Academy
  mapName: 'Academy'
  mapPath: /Maps/academy.yml
  minPlayers: 60
  stations:
    Academy:
      stationProto: StandardNanotrasenStation
      components:
