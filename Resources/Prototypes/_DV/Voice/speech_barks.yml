# Speech Bark prototypes for the voices
# The prototypes reference a soundCollection then define the playback
- type: bark
  id: Generic Low
  sounds:
    collection: BarkBass
  minPitch: 0.7
  maxPitch: 0.9
  volume: 0
  frequency: 1
  predictable: true

