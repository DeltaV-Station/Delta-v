- type: entity
  parent: BaseRoundstartAntagRule
  id: CosmicCult
  components:
  - type: CosmicCultRule
  - type: GameRule
    minPlayers: 15
    minTotalPlayers: 40
    delay:
      min: 60
      max: 120
  - type: AntagObjectives
    objectives:
    - CosmicFinalityObjective
    - CosmicMonumentObjective
    - CosmicConversionObjective
    - CosmicEntropyObjective
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: CosmicCultist
      range:
        min: 2
        max: 6
      playerRatio: 10

- type: antagSpecifier
  parent: RestrictedAntag
  id: CosmicCultist
  components:
  - type: CosmicCult
  mindRoles:
  - MindRoleCosmicCult