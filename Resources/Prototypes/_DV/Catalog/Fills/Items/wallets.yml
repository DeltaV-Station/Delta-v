- type: entity
  parent: NFBaseWallet
  id: ClothingWalletFilledRandom
  abstract: true
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - id: SpaceCash10
          prob: 0.3
          rolls: !type:ConstantNumberSelector
            value: 4 # Cash doesn't stack when filling. 4 is max before it overflows.
        - id: SpaceCash100
          weight: 0.75
          prob: 0.3
          rolls: !type:ConstantNumberSelector
            value: 4
        - id: SpaceCash1000
          weight: 0.25
        - id: SpaceCash10000
          weight: 0.0001
        - id: SpaceCash1000000
          weight: 0.0000001

