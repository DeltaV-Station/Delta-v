- type: entity
  parent: NFBaseWallet
  id: ClothingWalletFilled40
  abstract: true
  suffix: Filled, 40
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SpaceCash10
          rolls: !type:ConstantNumberSelector
            value: 4

