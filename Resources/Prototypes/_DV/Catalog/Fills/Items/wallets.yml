#Pirate
- type: entity
  parent: ClothingWalletLeatherBrown
  id: ClothingWalletLeatherPirateFilledRandom
  suffix: Filled, Random
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - id: TreasureCoinGold
        - id: TreasureCoinGold
          weight: 0.3
          rolls: !type:ConstantNumberSelector
            value: 2
        - id: TreasureCoinGold
          weight: 0.15
          rolls: !type:ConstantNumberSelector
            value: 3
        - id: TreasureCoinGold
          weight: 0.01
          rolls: !type:ConstantNumberSelector
            value: 4

