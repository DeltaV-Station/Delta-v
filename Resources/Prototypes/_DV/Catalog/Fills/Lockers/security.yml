- type: entityTable
  id: FillLockerArmorerHardsuit
  table: !type:AllSelector
    children:
    - id: ClothingOuterHardsuitCombatWarden
    - id: ClothingShoesBootsSecurityMagboots
    - id: OxygenTankFilled
    - id: NitrogenTankFilled
    - id: ClothingMaskGasSwat
