- type: entity
  id: BorgChassisSecurity
  parent: BorgChassisSelectable
  name: security cyborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: security

- type: entity
  id: SRNBorgChassisSelectable
  suffix: Robo Neuroticist
  parent: BorgChassisSelectable
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: SlavedBorg
    law: ObeySRN
  - type: DeviceNetwork
    receiveFrequencyId: SRNCyborgControl
    transmitFrequencyId: SRNRoboticsConsole
  - type: SurveillanceCamera
    networkSet: true
    nameSet: true
    id: SRNCyborgControl
    useEntityNameAsCameraId: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer_xenoborg.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PinpointerRoboNeuroticistPiece: 
            min: 1
            max: 1
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
        - borg_id_chip 
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      