- type: entity
  name: glimmer mite
  parent: MobCockroach
  id: MobGlimmerMite
  description: A strange pest from a world beyond the noosphere.
  components:
  - type: Sprite
    sprite: _DV/Mobs/Ghosts/glimmermite.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mite
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mite
      Dead:
        Base: mite_dead
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Ectoplasm
          Quantity: 15
  - type: Psionic
  - type: GlimmerSource
  - type: AmbientSound
    range: 6
    volume: -3
    sound: /Audio/_DV/Glimmer_Creatures/mite.ogg
  - type: AmbientOnPowered

- type: entity
  name: glimmer tick
  id: MobTick
  parent: SimpleSpaceMobBase
  description: A strange pest from a world beyond the noosphere. watch out for its nasty bite. 
  components:
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
      sprite: Mobs/Aliens/Xenos/spacetick.rsi
      scale: 0.8, 0.8
  - type: Physics
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.20
        density: 20
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 30
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: Stamina
    baseCritThreshold: 15
    animationThreshold: 5
  - type: MovementAlwaysTouching
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeatXeno
      amount: 1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 2
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Ectoplasm
          Quantity: 30
  - type: MeleeChemicalInjector
    solution: melee
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Speech
    speechVerb: SmallMob
  - type: NonSpreaderZombie
  - type: NightVision #DeltaV - Added nightvision to animals
    color: "#808080"

- type: entity
  parent:
  - BaseMob
  - MobCombat
  - MobDamageable
  id: MobGlimmerWisp
  name: glimmer wisp
  description: A strange orb that moves with intent.
  components:
  # appearance
  - type: Sprite
    sprite: Nyanotrasen/Mobs/Monster/glimmer_wisp.rsi
    layers:
    - state: willowisp
      shader: unshaded
  - type: PointLight
    color: "#419ba3"
  - type: Stealth
    lastVisibility: 0.66
  - type: AmbientSound
    volume: -8
    range: 5
    sound:
      path: /Audio/Nyanotrasen/Mobs/GlimmerWisp/wisp_ambience.ogg
  # physical
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 13
        mask:
        - SmallMobMask
        layer:
        - Opaque
  - type: MovementSpeedModifier
    baseSprintSpeed: 8
    baseWalkSpeed: 5
  - type: MovementIgnoreGravity
  - type: Speech
  # powers
  - type: Psionic
  - type: NoosphericZapPower
    canBeRemoved: false
  - type: LifeDrainer
    damage:
      types:
        Asphyxiation: 200
    whitelist:
      components:
      - Psionic
  # damage
  - type: Reactive
    groups:
      Acidic: [Touch] # Holy water
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Nyanotrasen/Mobs/GlimmerWisp/wail.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          Ectoplasm:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: ManifestedSpirit
    damageModifierSet: CorporealSpirit
  - type: DamageOnDispel
    damage:
      types:
        Heat: 100
  - type: SlowOnDamage
    speedModifierThresholds:
      150: 0.8
      200: 0.6
      250: 0.3
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown #KnockedDown is inseperable from stun because... IT JUST IS OK?
    - SlowedDown
    - Pacified
  # combat
  - type: Gun
    fireRate: 0.7
    soundGunshot:
      collection: MagicMissile
    showExamineText: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BatteryAmmoProvider
    proto: WispLash
    fireCost: 1
    # TODO: implement upstream or make it use a proper thing, maybe copy dragon
    #examinable: false
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 100
  # AI
  - type: HTN
    rootTask:
      task: GlimmerWispCompound
  - type: NpcFactionMember
    factions:
    - GlimmerMonster
  - type: NPCRetaliation
    attackMemoryLength: 10
