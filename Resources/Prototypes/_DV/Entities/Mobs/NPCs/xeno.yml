- type: entity
  name: boiler
  parent: [BaseMobXenonidTier3, MobXeno]
  id: MobXenoBoilerNPC
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/Xenos/boiler.rsi
    offset: 0,0.3
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Critical
      400: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      200: 0.6
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.5
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 6
  - type: BasicEntityAmmoProvider
    proto: BulletAcidBoiler
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.25
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg

- type: entity
  name: crusher
