# Xenonids tier 2

- type: entity
  abstract: true
  parent: BaseMobXenonid
  id: BaseMobXenonidTier2
  components:
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 3
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Stamina
    baseCritThreshold: 250
  - type: PassiveDamage
    damage:
      groups:
        Brute: -0.3
        Burn: -0.4
        Toxin: -0.2
        Metaphysical: -0.2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 950
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: lurker
  parent: [BaseMobXenonidTier2, MobXeno]
  id: MobXenoLurkerNPC
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/Xenos/lurker.rsi
    offset: 0,0.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      240: Critical
      300: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      120: 0.7
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
     types:
       Piercing: 15
       Slash: 5
       Structural: 10
  - type: TrafficHazard
    bonkMultiplier: 0.0
    stunTime: 1
    collisionDamage:
      types:
        Piercing: 15
        Slash: 10
  - type: JumpAbility
    jumpDistance: 4
    jumpThrowSpeed: 10
  - type: Stealth
    maxVisibility: 0.9
    minVisibility: -1.5
  - type: StealthOnMove
    movementVisibilityRate: 1.5
    passiveVisibilityRate: -0.3

# Xenonids tier 3

