# GhostTakeover

# Snakes
- type: entity
  parent: MobPurpleSnake
  id: MobPurpleSnakeGhost
  suffix: Player
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: salvage snake
    description: You are a salvage snake hunting for a meal.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

- type: entity
  parent: MobSmallPurpleSnake
  id: MobSmallPurpleSnakeGhost
  suffix: Player, Small
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: salvage snake
    description: You are a salvage snake hunting for a meal.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

# Xenonids

- type: entity
  abstract: true
  id: BaseMobXenonid
  suffix: Player
  components:
  - type: NoFriendlyFire
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: XenonidBlood # DeltaV - was FluorosulfuricAcid
        Quantity: 650
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Puller
    needsHands: false

- type: entity
  abstract: true
  id: BaseMobXenonidTier1
  suffix: Player
  components:
  - type: Prying
    pryPowered: true
