# GhostTakeover

# Snakes
- type: entity
  parent: MobPurpleSnake
  id: MobPurpleSnakeGhost
  suffix: Player
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: salvage snake
    description: You are a salvage snake hunting for a meal.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

- type: entity
  parent: MobSmallPurpleSnake
  id: MobSmallPurpleSnakeGhost
  suffix: Player, Small
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: salvage snake
    description: You are a salvage snake hunting for a meal.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

# Xenonids base

- type: entity
  abstract: true
  id: BaseMobXenonid
  suffix: AI
  components:
  - type: NoFriendlyFire
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: XenonidBlood
        Quantity: 650
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Puller
    needsHands: false
  - type: Stamina
    baseCritThreshold: 200
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      160: Critical
      200: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      80: 0.7
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      groups:
        Brute: -0.15
        Burn: -0.2
        Toxin: -0.1
        Metaphysical: -0.1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Xenonid
  - type: Body
    prototype: Bloodsucker

