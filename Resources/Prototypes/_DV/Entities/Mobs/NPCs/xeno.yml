  - type: TrafficHazard
    minimumSpeed: 4
    minimumSpeedDifference: 6
    bonk: false
    stunTime: 1
    collisionDamage:
      types:
        Blunt: 20
  - type: JumpAbility
    jumpDistance: 8
    jumpThrowSpeed: 8

