      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Critical
      600: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      300: 0.9
      400: 0.8
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    attackRate: 0.6
    damage:
     types:
       Blunt: 25
