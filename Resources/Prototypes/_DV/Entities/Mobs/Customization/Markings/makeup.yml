- type: marking
  id: MakeupLips
  bodyPart: Head
  groupWhitelist: [Human, Slime, Felinid, Oni, Harpy, Kitsune]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#7e2727"
  sprites:
