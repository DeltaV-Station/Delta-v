- type: entity
  parent: MarkerBase
  id: SpesoSpawner
  name: random money spawner
  suffix: 1-30
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: Objects/Economy/cash.rsi
    layers:
    - state: cash
  - type: EntityTableSpawner
    table: !type:GroupSelector
      prob: 0.85
      children:
      - id: SpaceCash
        amount: !type:RangeNumberSelector
          range: 1, 9
      - id: SpaceCash10
        prob: 0.1
        amount: !type:RangeNumberSelector
          range: 1, 3

- type: entity
