  - type: EntityTableSpawner
    table: !type:GroupSelector
      prob: 0.85
      children:
      - id: SpaceCash
        amount: !type:RangeNumberSelector
          range: 1, 9
      - id: SpaceCash10
        prob: 0.1
        amount: !type:RangeNumberSelector
          range: 1, 9
      - id: SpaceCash100
        prob: 0.01
