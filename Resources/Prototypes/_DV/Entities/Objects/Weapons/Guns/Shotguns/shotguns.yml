- type: entity
  name: adjutant
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponShotgunAdjutant
  description: A semi-automatic magazine-fed shotgun manufactured by Nanotrasen. trading firerate for a compact and user-friendly design.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Shotguns/Adjutant.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Shotguns/Adjutant.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: WeaponShotgunKammerer
  id: WeaponShotgunKammererNonLethal
  suffix: Beanbag
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunBeanbag

- type: entity
  parent: BaseItem
  id: WeaponRiotShotgunBorg
  name: borg riot shotgun
  description: A heavily modified shotgun for borgs, firing off beanbag rounds. Ammo replicates over time.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Shotguns/enforcer.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Appearance
  - type: Item
    size: Huge
  - type: Gun
    minAngle: 0
    maxAngle: 10
    angleIncrease: 1
    angleDecay: 16
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: Battery
    maxCharge: 400
    startingCharge: 200
  - type: BatteryAmmoProvider
    proto: PelletShotgunBeanbag
    fireCost: 100
  - type: AmmoCounter
  - type: BatterySelfRecharger
    autoRechargeRate: 20

- type: entity
  parent: WeaponShotgunKammerer
  id: WeaponShotgunKammererIncendiary
  suffix: Incendiary
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunIncendiary

- type: entity
  parent: WeaponShotgunBulldog
  id: WeaponShotgunAntelope
  name: Antelope
  description: An automatic, magazine fed shotgun produced by a NanoTrasen subsidary. Not as refined as the Waffle Co. counterpart, but it gets the job done.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Shotguns/Antelope.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Shotguns/Antelope.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage

- type: entity
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponShotgunElephant
  name: elephant gun
  description: A gun made with a unique flavor of hatred and malice. Questionable quality. Prone to inconsistent performace.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Shotguns/elephant_gun.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: MeleeWeapon
    wideAnimationRotation: 270
    attackRate: 1
    angle: 100
    range: 2.0
    damage:
      types:
        Blunt: 10
  - type: MeleeRequiresWield
  - type: AltFireMelee
    attackType: Heavy
  - type: Item
    size: Huge
    shape:
    - 0,0,7,0
  - type: Gun
    cameraRecoilScalar: 25.0 # only a REAL scallywag can handle this
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ChanceGun
    ammoList:
    - ShellShotgunLowPower
    - ShellShotgunMediumPower
    - ShellShotgunHighPower
  - type: ContainerContainer
    containers:
      gun_chamber: !type:ContainerSlot
  - type: GunBreaking
  - type: GunDelay
  - type: ItemSlots
    slots:
      gun_chamber:
          name: Chamber
          startingItem: null
          priority: 1
          disableEject: true
          insertOnInteract: false
          whitelist:
            tags:
              - ElephantShotgun
  - type: ChamberMagazineAmmoProvider
    canRack: false
    boltClosed: null
