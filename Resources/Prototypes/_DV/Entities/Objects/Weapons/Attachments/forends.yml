# I googled if this was the right name for this part of the gun because using "barrel" has too much overlap
# I'm probably not right but "forend" gets the point across

- type: entity
  parent: BaseGunAttachmentForend
  id: GunAttachmentForendFactory
  name: factory forend
  description: The intended experience of the LARP-26.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: medicalintern
  - type: ESGunRecoilAttachment # make these mean something eventually
    recoilRecoveryModifier: 1.05
    recoilIncreaseModifier: 0.90
    minSpreadModifier: 0.90
    maxSpreadModifier: 0.95
  - type: ESGunComponentAttachment
    component:
    - type: GunUpgradeFireRate
      coefficient: 1
  - type: Tag
    tags:
    - AttachmentForend
    - AttachmentForendBase

- type: entity
  parent: BaseGunAttachmentForend
  id: GunAttachmentForendSuppressed
  name: suppressed forend
  description: So much LARP-26, it's a crime.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: medicalintern
  - type: ESGunRecoilAttachment # make these mean something eventually
    recoilRecoveryModifier: 1.10
    recoilIncreaseModifier: 0.85
    minSpreadModifier: 0.85
    maxSpreadModifier: 0.9
  - type: ESGunSoundAttachment
    sound:
      path: /Audio/Weapons/Guns/Gunshots/silenced.ogg
      params:
        maxDistance: 4
  - type: ESGunComponentAttachment
    component:
    - type: GunUpgradeFireRate
      coefficient: 0.95
  - type: Tag
    tags:
    - AttachmentForend
    - AttachmentForendSuppressed

- type: entity
  parent: BaseGunAttachmentForend
  id: GunAttachmentForendSniper
  name: sniper forend
  description: What the hell kind of shot are you making, on a space station, that needs THIS?
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: medicalintern
  - type: ESGunRecoilAttachment # make these mean something eventually
    recoilRecoveryModifier: 1.20
    recoilIncreaseModifier: 0.70
    minSpreadModifier: 0.8
    maxSpreadModifier: 0.83
  - type: ESGunComponentAttachment
    component:
    - type: GunUpgradeFireRate
      coefficient: 0.80
  - type: Tag
    tags:
    - AttachmentForend
    - AttachmentForendSniper
