- type: entity
  parent: BaseGunAttachmentOptic
  id: GunAttachmentOpticHolo
  name: holographic sight
  description: Doesn't provide zoom, but helps with re-acquiring targets after recoil.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: securitycadet
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 1.5
    recoilIncreaseModifier: 1
    minSpreadModifier: 1.0
    maxSpreadModifier: 1.1
  - type: Tag
    tags:
    - AttachmentOptic
    - AttachmentOpticHolo

- type: entity
  parent: BaseGunAttachmentOptic
  id: GunAttachmentOpticHolo4x
  name: 4x sight
  description: Helps see targets at medium range, but the added zoom may make it harder to recover from recoil.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: securityofficer
  - type: ESGunComponentAttachment
    component:
    - type: CursorOffsetRequiresWield
    - type: EyeCursorOffset
      maxOffset: 3
      pvsIncrease: 0.5
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 0.2
    recoilIncreaseModifier: 99
    minSpreadModifier: 99
    maxSpreadModifier: 99
  - type: Tag
    tags:
    - AttachmentOptic
    - AttachmentOptic4x

- type: entity
  parent: BaseGunAttachmentOptic
  id: GunAttachmentOpticHolo8x
  name: 8x scope
  description: Allows for combat at long ranges - if you can control the recoil, that is.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: warden
  - type: ESGunComponentAttachment
    component:
    - type: CursorOffsetRequiresWield
    - type: EyeCursorOffset
      maxOffset: 6
      pvsIncrease: 0.9
  - type: ESGunRecoilAttachment
    recoilRecoveryModifier: 0.4
    recoilIncreaseModifier: 2
    minSpreadModifier: 1.0
    maxSpreadModifier: 1.3
  - type: Tag
    tags:
    - AttachmentOptic
    - AttachmentOptic8x
