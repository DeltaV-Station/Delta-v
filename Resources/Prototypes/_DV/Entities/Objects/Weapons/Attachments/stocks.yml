    coefficient: 1.1 # terrible idea
  - type: ESGunComponentAttachment
    component:
    - type: Wieldable
      unwieldOnUse: false
    - type: GunWieldBonus
      minAngle: -5.0
      maxAngle: -11.0
      angleDecay: 2.0
  - type: Tag
    tags:
    - AttachmentStock
    - AttachmentWireStock

