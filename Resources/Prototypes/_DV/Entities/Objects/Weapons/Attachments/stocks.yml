- type: entity
  parent: BaseGunAttachmentStock
  id: GunAttachmentStock
  name: stock
  description: Allows you to wield your weapon, if you couldn't before.
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi
    state: cargotechnician
  - type: ESGunRecoilAttachment # make these mean something eventually
    recoilRecoveryModifier: 1.00
    recoilIncreaseModifier: 0.85
    minSpreadModifier: 1.25
    maxSpreadModifier: 1.25
  - type: GunUpgradeFireRate
    coefficient: 1.43
  - type: ESGunComponentAttachment
    component:
    - type: Wieldable
      unwieldOnUse: false
    - type: GunWieldBonus
      minAngle: -7
      maxAngle: -15
  - type: Tag
    tags:
    - AttachmentStock
    - AttachmentBasicStock

