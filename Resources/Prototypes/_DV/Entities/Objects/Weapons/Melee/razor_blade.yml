- type: entity
  parent: BaseItem
  id: Razorblade
  name: razor blade
  description: A small, hastily crafted razor blade. Perfect for shaving!
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Materials/Shards/shard.rsi
    state: shard1
  - type: Tag
    tags:
    - Razorblade
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Slash: 6
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 6
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1
        reagents:
        - ReagentId: Razorblade
          Quantity: 1
  - type: DrainableSolution
    solution: food
  - type: SolutionTransfer
    canSend: true
    canReceive: false
    transferAmount: 1
  - type: DeleteOnSolutionEmpty
    solution: food

- type: entity
  parent: ClothingHeadHatGreyFlatcap
  id: RazorGreyFlatcap
  name: grey flatcap
  description: Fashionable for both the working class and old man Jenkins. This one has razor blades sewn in. Scary.
  components:
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Slash: 8
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 14
- type: entity
  parent: ClothingHeadHatBrownFlatcap
  id: RazorBrownFlatcap
  name: brown flatcap
  description: Stupid clown! You made me look bad! This one has razor blades sewn in. Scary.
  components:
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Slash: 8
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 14

