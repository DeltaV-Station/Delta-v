- type: entity
  parent: BaseKnife
  id: CursedKnife
  name: cursed knife
  description: An unassuming bread knife. You feel something evil eminating from it...
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/cursed_knife.rsi
    layers:
    - state: tier-one
      map: [ "knife" ]
  - type: Item
    sprite: _DV/Objects/Weapons/Melee/cursed_knife.rsi
    storedOffset: -1,-3
    storedRotation: -45
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 6
  - type: AdrenalineMelee
    adrenalinePerHit: 10
    adrenalineFallAmount: 5
    tiers:
    - visual: TierOne
      damage:
        types:
          Slash: 6
    - visual: TierTwo
      activate: true
      reflect: 0.15
      adrenalineRequired: 50
      damage:
        types:
          Slash: 10
          Soul: 6
    - visual: TierThree
      activate: true
      reflect: 0.35
      adrenalineRequired: 80
      speedMultiplier: 1.2
      damage:
        types:
          Slash: 15
          Soul: 10
  - type: ItemToggle
    onUse: false 
    onActivate: false 
  - type: ItemToggleSize
    activatedSize: Ginormous
  - type: HeldSpeedModifier 
    walkModifier: 1
    sprintModifier: 1 
  - type: DisarmMalus
    malus: 0.8
  - type: Reflect 
    reflectProb: .15 
    spread: 30 
    reflects:
    - Energy
    - NonEnergy
  - type: PointLight
    enabled: false
    radius: 2
    energy: 5
    color: '#550405FF'
    netsync: false
  - type: Appearance
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: ToggleableVisuals 
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-blade
        shader: unshaded
      right:
      - state: inhand-right-blade
        shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.AdrenalineMeleeVisuals.State:
        knife:
          TierOne: { state: tier-one }
          TierTwo: { state: tier-two }
          TierThree: { state: tier-three }
