- type: entity
  parent: [BaseItem]
  id: GravGauntlet
  name: Grav Gauntlet MK-00c
  description: A developmental prototype of Nanotrasen's Melee Arms Department. When striking an enemy, a gravitational wave pulses and sweeps them in for a follow-up.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/grav_gauntlet.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.4 # so you can actually use the pull
    attackRate: 0.85 # heavy friggin fists bro
    angle: 0
    animation: WeaponArcFist
    wideAnimationRotation: 230
    damage:
      types:
        Blunt: 20
        Heat: 3
        Structural: 20
  - type: Reflect # ok so i know this sounds like it would be broken but it really doesnt proc enough for it to be a major problem with any NT standard armor
    reflectProb: .30
  - type: IncreaseDamageOnWield
    damage:
      types:
        Heat: 7
        Structural: 5
  - type: Wieldable
  - type: MeleeThrowOnHit
    speed: 2
    distance: -.75
  - type: AltFireMelee
    attackType: Heavy
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2
  - type: HeldSpeedModifier # no more tazer means you need to RUN to catch people so uh PICK UP YO PACE
    walkModifier: 1.25
    sprintModifier: 1.25
  - type: Clothing
    quickEquip: false
    slots:
    - belt
      - suitStorage
  - type: Tag
    tags:
    - HighRiskItem
    - Sidearm
  - type: StealTarget
    stealGroup: HoSSidearm
