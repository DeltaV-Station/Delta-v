  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2
  - type: Gun #apersos was here
    projectileSpeed: 6
    soundGunshot: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    fireRate: 1
    useKey: false
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 55
  - type: BasicEntityAmmoProvider
    proto: BulletTaser # most balanced kinda, better than a stun shotgun
    capacity: 1
    count: 1
  - type: MeleeThrowOnHit
    speed: 5.75
    distance: -.75
  - type: Clothing
    sprite: _DV/Objects/Weapons/C_Gauntlet.rsi
    quickEquip: false
    slots:
    - belt
    - suitStorage
  - type: Tag
    tags:
    - HighRiskItem
    - Sidearm
  - type: StealTarget
    stealGroup: HoSSidearm
