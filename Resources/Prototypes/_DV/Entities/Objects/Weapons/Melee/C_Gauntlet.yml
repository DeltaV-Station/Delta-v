- type: entity
  parent: BaseItem
  id: CGauntlet
  name: Grav Gauntlet MK-00c
  description: A experimental gauntlet equipped with a mini gravity generator to make sure there is no running from JUSTICE!!!!
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/C_Gauntlet.rsi
    state: icon
  - type: MeleeWeapon
    size: large
    range: 1.2 # so you can actually use the pull
    attackRate: 0.70 # heavy friggin fists bro
    angle: 0
    animation: WeaponArcFist
    wideAnimationRotation: 145
    damage:
      types:
        Slash: 2
        Blunt: 33
        Structural: 35
  - type: Wieldable
    unweieldOnUse: false
  - type: GunRequiresWield #gotta steady your arm to aim duhhh
