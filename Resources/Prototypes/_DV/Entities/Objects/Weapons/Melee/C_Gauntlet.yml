- type: entity
  parent: BaseItem
  id: CGauntlet
  name: Prototype Gauntlet MK-00c
  description: A new experiment made to level the playing field... literally. NOW GO BEAT UP PEOPLE!!
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/C_Gauntlet.rsi
    state: icon
  - type: MeleeWeapon
    size: large
    range: 1.3 # so you can actually use the pull
    attackRate: 0.55 # heavy friggin fists bro
    angle: 0
    animation: WeaponArcFist
    wideAnimationRotation: 145
    damage:
      types:
        Slash: 5
        Blunt: 30
        Structural: 35
  - type: Wieldable
    unweieldOnUse: false
  - type: GunRequiresWield #gotta steady your arm to aim duhhh
  - type: AmmoCounter
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2
  - type: Gun
    projectileSpeed: 6
    soundGunshot: /Audio/_DV/Weapons/scytheshot.ogg
    fireRate: 1
    useKey: false
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 55
  - type: BasicEntityAmmoProvider
    proto: BulletTaser # most balanced kinda, better than a stun shotgun
    capacity: 1
    count: 1
  - type: MeleeThrowOnHit
    speed: 5.75
    distance: -.75
  - type: Clothing
    sprite: _DV/Objects/Weapons/C_Gauntlet.rsi
    quickEquip: false
    slots:
      - belt
      - suitStorage
