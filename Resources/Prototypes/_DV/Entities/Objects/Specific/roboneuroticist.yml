- type: entity
  parent: ToolboxThief
  id: RoboNeuroticistStash
  name: roboneuroticist's specialty
  description: "You've trained for this. Pick how you want to specialize"
  components:
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    toolName: neuroticist-stash-window-title
    toolDesc: neuroticist-stash-window-description
    possibleSets:
    - RoboNeuroticistCommander
    - RoboNeuroticistBreacher
    - RoboNeuroticistPirate
    - RoboNeuroticistMalpractice

- type: entity
  parent: BorgHypo
  id: SyndicateNocturineHypo
  name: nocturine hypo
  description: A self-refilling injector for rapid administration of nocturine to victms.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: borghypo_s
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
        reagents:
        - ReagentId: Nocturine
          Quantity: 20
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: Nocturine
        Quantity: .1

- type: entity
  parent: PinpointerSyndicateNuclear
  id: RoboNeuroticistPointer
  name: roboneuroticist shuttle pointer
  description: Always points back to the Robotocist's trusty robotics console
  components:
  - type: Pinpointer
    component: SRNConsoleTracker
    targetName: syndicate robotics control console
  - type: Construction
    graph: RepairRoboNeuroticistPointer
    node: repairedPinpointer

- type: entity
  parent: CyborgEndoskeleton
  id: SRNCyborgEndoskeleton
  name: syndicate cyborg endoskeleton
  description: A frame that syndicate cyborgs are built on. About as scary as expected.
  components:
    - type: Sprite
      noRot: true
      drawdepth: Items
      sprite: _DV/Objects/Specific/Robotics/srn_borg.rsi
      state: icon
    - type: Construction
      graph: SRNCyborg
      node: start
      defaultTarget: srncyborg
      containers:
      - part-container
      - cell_slot

- type: entity
  parent: BaseItem
  id: PinpointerRoboNeuroticistPiece
  name: piece of a syndicate pinpointer
  description: A piece of a syndicate pinpointer. You need four pieces to repair it.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer-roboneuroticist-piece-1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        pinpointer-roboneuroticist-piece-1: ""
        pinpointer-roboneuroticist-piece-2: ""
        pinpointer-roboneuroticist-piece-3: ""
        pinpointer-roboneuroticist-piece-4: ""
  - type: Item
  - type: Tag
    tags:
    - RoboNeuroticistPinpointerPiece
