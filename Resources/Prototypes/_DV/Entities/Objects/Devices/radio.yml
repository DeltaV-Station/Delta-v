- type: entity
  parent: RadioHandheld
  id: RadioHandheldSyndicate
  name: syndicate radio
  description: A nefarious syndicate radio.
  components:
  - type: RadioMicrophone
    broadcastChannel: Syndicate
  - type: RadioSpeaker
    channels:
    - Syndicate
  - type: Sprite
    sprite: _DV/Objects/Devices/communication.rsi
    layers:
    - state: syndietalkie-off
    - state: syndietalkie-broadcasting
      map: [ "broadcasting" ]
      shader: unshaded
      visible: false
    - state: walkietalkie-speaker
      map: [ "speaker" ]
      shader: unshaded
      visible: false
  - type: Item
    sprite: _DV/Objects/Devices/communication.rsi
    heldPrefix: syndietalkie-off
