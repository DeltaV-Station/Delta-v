- type: entity
  name: notary stamp
  parent: RubberStampBase
  id: RubberStampNotary
  suffix: DO NOT MAP
  description: An old-fashioned seal for marking important documents, made of polished bronze.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-notary
    stampedColor: "#a81f3d"
    stampState: "paper_stamp-notary"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi
    state: stamp-notary
  - type: StealTarget
    stealGroup: RubberStampNotary

- type: entity
  name: chief justice stamp
  parent: RubberStampBase
  id: RubberStampChiefJustice
  suffix: DO NOT MAP
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-chiefjustice
    stampedColor: "#6b2833"
    stampState: "paper_stamp-notary"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi
    state: stamp-cj

- type: entity
  name: prosecutor's rubber stamp
  parent: RubberStampBase
  id: RubberStampProsec
  suffix: DO NOT MAP
  description: A rubber stamp for stamping important documents. A more legal way to annoy Security.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-prosec
    stampedColor: "#562D3D"
    stampState: "paper_stamp-prosec"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi
    state: stamp-prosec

- type: entity
  name: armorer's rubber stamp
  parent: [RubberStampBase, BaseSecurityContraband]
  id: RubberStampArmorer
  categories: [ DoNotMap ]
  description: A rubber stamp for stamping important documents. Or weapons licenses for passengers.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-armorer
    stampedColor: "#5b0000"
    stampState: "paper_stamp-armorer"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi
    state: stamp-armorer

- type: entity
  name: warden's rubber stamp
  parent: [RubberStampBase, BaseSecurityContraband]
  id: RubberStampJusticeWarden
  categories: [ DoNotMap ]
  description: With a simple press of ink to paper, a life is sealed behind bars. Maybe not forever
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-warden
    stampedColor: "#0000af" # DeltaV - Security is blue. Was 5b0000
    stampState: "paper_stamp-warden"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi # DeltaV - New sprite for blue warden stamp
    state: stamp-warden

- type: entity
  parent: RubberStampBase
  id: RubberStampHatePaperwork
  name: paperwork hater rubber stamp
  description: An incandescent stamp, its so hot that any paper you stamp with it is sure to catch on fire.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-hate-paperwork
    stampedColor: "#ff0000"
    stampState: "paper_stamp-generic"
  - type: Sprite
    sprite: _DV/Objects/Misc/stamps.rsi
    state: stamp-hate-paperwork
  - type: IgnitionSource
    ignited: true
    temperature: 10
  - type: PointLight
    enabled: true
    netsync: false
    radius: 1.2
    color: orange

- type: entity
  name: IA rubber stamp
  parent: RubberStampBase
  id: RubberStampNTAgent
  suffix: DO NOT MAP
  description: A rubber stamp for stamping important documents. For internal related affairs.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-NTAgent
    stampedColor: "#000080"
    stampState: "paper_stamp-cap"
  - type: Sprite
    state: stamp-cap
