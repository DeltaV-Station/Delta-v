- type: entity
  parent: BaseItem
  id: UnstableReactorCore
  name: Unstable Reactor Core
  description: A compact, circular-shaped reactor, incapable of fully containing its energy. It's quite the fancy paperweight.
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/unstablereactorcore.rsi
    state: icon
  - type: RadiationSource
    intensity: 4
    slope: 0.2
  - type: PointLight
    color: "#00FF00"
  - type: Tag
    tags:
    - UnstableReactorCore

- type: entity
  parent: [BaseItem, BaseItemCabinet]
  id: UnstableReactorContainer
  name: unstable reactor container
  description: A solid, lead-based containment unit capable of completely enclosing the radioactive energy of an unstable reactor core.
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/unstable_reactor_container.rsi
    layers:
    - state: closed
      map: [ "enum.OpenableVisuals.Layer" ]
    - state: core_closed
      map: [ "enum.ItemCabinetVisuals.Layer" ]
      visible: false
      shader: unshaded
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: RadiationBlockingContainer
    resistance: 4
  - type: ItemSlots
    slots:
      ItemCabinet:
        whitelist:
          tags:
          - UnstableReactorCore
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { state: open }
          False: { state: closed }
        enum.ItemCabinetVisuals.Layer:
          True: { state: core_open }
          False: { state: core_closed }
      enum.ItemCabinetVisuals.ContainsItem:
        enum.ItemCabinetVisuals.Layer:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: UnstableReactorContainer
  id: UnstableReactorContainerFilled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      ItemCabinet:
        startingItem: UnstableReactorCore

- type: entity
  parent: BaseItem
  id: UnstableReactorHousing
  name: Unstable Reactor Housing
  description: A heavy housing engineered to contain the power output of an unstable reactor core and focus it into a dense, radioactive beam. It's missing its power source.
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/unstablereactorhousing.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: HeldSpeedModifier
  - type: Construction
    graph: UnstableCoreRefractor
    node: start
  - type: Tag
    tags:
    - UnstableReactorHousing
