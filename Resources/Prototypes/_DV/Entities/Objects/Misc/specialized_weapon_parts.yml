- type: entity
  parent: BaseItem
  id: UnstableReactorCore
  name: Unstable Reactor Core
  description: A compact circular shaped reactor putting off way more energy than it can handle. It seems like quite the fancy paperweight.
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/unstablereactorcore.rsi
    state: icon
  - type: RadiationSource
    intensity: 1
    slope: 0.2
  - type: PointLight
    color: "#00FF00"
  - type: Tag
    tags:
    - UnstableReactorCore

- type: entity
  parent: BaseItem
  id: UnstableReactorHousing
  name: Unstable Reactor Housing
  description: A heavy housing made to contain the power outputted by a unstable reactor core and focus it into a dence beam, pretty useless without it isnt it?
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/unstablereactorhousing.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: HeldSpeedModifier
  - type: Construction
    graph: UnstableCoreRefractor
    node: start
  - type: Tag
    tags:
    - UnstableReactorHousing
