- type: entity
  parent: SurveillanceCameraRouterBase
  id: SurveillanceCameraRouterAI
  name: AI camera router
  suffix: AI
  components:
    - type: SurveillanceCameraRouter
      subnetFrequency: SurveillanceCameraAI

- type: entity
  parent: SurveillanceCameraRouterBase
  id: SurveillanceCameraRouterJustice
  name: justice camera router
  suffix: Justice
  components:
  - type: SurveillanceCameraRouter
    subnetFrequency: SurveillanceCameraJustice

- type: entity
  parent: SurveillanceCameraRouterBase
  id: SRNSurveillanceCameraRouter
  name: syndicate borg monitoring router
  suffix: Robo-Neuroticist
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SRNRoboticsConsole
    transmitFrequencyId: SRNRoboticsConsole
  - type: WirelessNetworkConnection
    range: 2000
  - type: SurveillanceCameraRouter
    subnetFrequency: SRNCyborgControl
  - type: Machine
    board: SRNSurveillanceCameraRouterCircuitboard