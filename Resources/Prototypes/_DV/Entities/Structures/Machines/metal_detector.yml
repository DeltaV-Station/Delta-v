- type: entity
  id: MetalDetector
  name: Metal Detector
  description: Beeps when metal and contraband is detected by a passing person.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DV/Structures/Machines/metal_detector.rsi
    layers:
    - state: metal_detector_off
      map: [ "enum.MetalDetectorVisualLayers.MetalDetectorLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.MetalDetectorVisuals.MetalDetectorActivated:
        enum.MetalDetectorVisualLayers.MetalDetectorLayer:
          True: { state: metal_detector_on }
          False: { state: metal_detector_off }
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Construction
    graph: MetalDetectorGraph
    node: metalDetector
  - type: Transform
    anchored: true
  - type: ExtensionCableReceiver
  - type: Lock
    locked: true
  - type: AccessReader
    access: [[ "Security" ]]
  - type: LightningTarget
    priority: 1
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    ports:
    - Trigger
  - type: LockedWiresPanel
  - type: LockedAnchorable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: ToggleableVisuals
    spriteLayer: null
  - type: ItemToggle
    predictable: false # issues between ToggleCellDraw and ItemToggleActiveSound
    onActivate: false
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2.5
    energy: 3
    color: red
    netsync: false
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 360
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Effects/Vehicle/policesiren.ogg
      params:
        volume: -3
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 100
        hard: false
        layer:
        - LowImpassable
  - type: MetalDetector
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    stepOn: true
