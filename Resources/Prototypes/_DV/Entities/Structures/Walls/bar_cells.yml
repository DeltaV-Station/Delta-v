- type: entity
  parent: BaseStructure
  id: WallCellBar
  name: cell wall
  description: A wall made of security bars.
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/Cells/bar.rsi
    state: bar
    drawdepth: Walls
  - type: Icon
    sprite: _DV/Structures/Walls/Cells/bar.rsi
    state: bar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.55,0.5,0.35"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: SpriteFade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact

- type: entity
