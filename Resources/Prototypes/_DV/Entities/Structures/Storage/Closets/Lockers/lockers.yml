# Epistemics
- type: entity
  parent: LockerBooze
  id: LockerForensicMantis
  name: psionic mantis' cabinet
  suffix: Empty
  description: You'll never know what's inside until you collapse the quantum superposition of all possible mysteries.
  components:
  - type: AccessReader
    access: [["Mantis"]]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
          MaterialWoodPlank1:
            min: 1
            max: 2

- type: entity
  parent: LockerForensicMantis
  id: LockerArchivist
  name: archivist's cabinet
  suffix: Empty
  description: You'll never know what's inside until you collapse the quantum superposition of all possible mysteries.
  components:
  - type: AccessReader
    access: [ [ "Library" ] ]

# Gun safe
- type: entity
  id: SalvageGunSafeBaseSecure
  parent: GunSafe
  name: salvage gun safe
  suffix: LO, Locked, Empty
  components:
  - type: Appearance
  - type: Sprite
    sprite: _DV/Structures/Storage/Closets/gunsafe.rsi
    noRot: true
    layers:
    - state: salvage
      map: ["enum.StorageVisualLayers.Base"]
    - state: salvage-open
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: salvage
    stateDoorOpen: salvage-open
    stateDoorClosed: salvage-door
  - type: AccessReader
    access: [["Quartermaster"]]

