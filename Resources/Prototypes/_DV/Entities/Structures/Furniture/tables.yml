- type: entity
  parent: TableFrame
  id: TableWoodFrameDV
  name: wooden frame
  description: Pieces of wood that make up the frame of an unfinished object.
  components:
  - type: Sprite
    sprite: _DV/Structures/Furniture/Tables/Counters/wood_frame.rsi
  - type: Icon
    sprite: _DV/Structures/Furniture/Tables/Counters/wood_frame.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: N14TableRecipes
    node: tableWoodFrameDV

- type: entity
  parent: TableWoodFrameDV
  id: TableMetalFrameDV
  name: metal frame
  description: Pieces of metal that make up the frame of an unfinished object.
  components:
