# only scrubs tritium and won't set air alarms to warning/danger
- type: entity
  parent: [ BaseUnsetSensor, GasVentScrubber ]
  id: GasVentScrubberTritium
  suffix: Tritium
  components:
  - type: GasVentScrubber
    wideNet: true
    filterGases:
    - Tritium

# Kitchen freezer, cant go below 230.15 K
- type: entity
  parent: GasThermoMachineFreezer
  id: GasThermoMachineKitchenFreezer
  name: kitchen freezer
  components:
  - type: Sprite
    sprite: _DV/Structures/Piping/Atmospherics/kitchenthermomachine.rsi
    granularLayersRendering: true
    layers:
    - state: freezerOff
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: freezerPanelOpen
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      renderingStrategy: Default
  - type: GasThermoMachine
    minTemperature: 230.15
    targetTemperature: 235.15
  - type: Machine
    board: KitchenFreezerMachineCircuitBoard

# Sauna heater, cant go above 373,15 K (100C)
- type: entity
  parent: GasThermoMachineHeater
  id: GasThermoMachineSaunaHeater
  name: sauna heater
  components:
  - type: Sprite
    sprite: _DV/Structures/Piping/Atmospherics/kitchenthermomachine.rsi
    layers:
    - state: heaterOff
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: heaterPanelOpen
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - state: pipe
      map: [ "enum.PipeVisualLayers.Pipe" ]
      renderingStrategy: Default
  - type: GasThermoMachine
    maxTemperature: 363.15
    targetTemperature: 323.15
    coefficientOfPerformance: 0.95
  - type: Machine
    board: SaunaHeaterMachineCircuitBoard
