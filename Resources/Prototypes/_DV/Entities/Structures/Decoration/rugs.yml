- type: entity
  abstract: true
  parent: BaseStructure
  id: N14CarpetSingleBase
  description: Better than the floor.
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    drawdepth: FloorTiles
  - type: Transform
    anchored: false
  - type: Physics
    canCollide: false
  - type: Fixtures
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              MaterialCloth1:
                min: 3
                max: 3

#region Rugs

- type: entity
  parent: N14CarpetSingleBase
  id: N14RugBlue
  name: blue rug
  description: A modern looking blue rug.
  components:
  - type: Sprite
    sprite: _DV/Structures/Decoration/rugs.rsi
    state: blue
  - type: Construction
