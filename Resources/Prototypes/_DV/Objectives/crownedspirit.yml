- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCrownedSpiritObjective
  components:
  - type: Objective
    difficulty: 1 # unused
    issuer: objective-issuer-crownedspirit
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: RoleRequirement
    roles:
    - CrownedSpiritRole

- type: entity
  parent: [BaseCrownedSpiritObjective, BaseSurviveObjective]
  id: CrownedSpiritServeObjective
  name: Find someone wicked to serve.
  description: Find someone wicked and offer them your power.. for a price.
  components:
  - type: Objective

- type: entity
  parent: BaseCrownedSpiritObjective
  id: CrownedSpiritKillObjective
  name: Ensure their corruption.
  description: Have your new charge cause your target's death. Do not kill them yourself unless your charge orders it. This must be their own decision.
  components:
  - type: Objective
    issuer: objective-issuer-crownedspirit
    unique: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: objective-condition-crownedspirit-corruption-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
    - !type:ObjectiveImmuneFilter
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition

- type: entity
  parent: [BaseCrownedSpiritObjective, BaseSurviveObjective]
  id: CrownedSpiritPunishObjective
  name: Punish them for their actions.
  description: Punish the one you have chosen to serve. Through their actions, a life you chose has been taken. Return the favor to them.
  components:
  - type: Objective
