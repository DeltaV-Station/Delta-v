- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFugitiveObjective
  components:
  - type: Objective
    issuer: objective-issuer-fugitive
    difficulty: 1
  - type: RoleRequirement
    roles:
    - FugitiveRole

- type: entity
  parent: [BaseFugitiveObjective, BaseLivingObjective]
  id: FugitiveEscapeObjective
  name: Evade law enforcement
  description: You will never atone for your crimes, make sure of it by blending into the crowd.
  components:
  - type: Objective
    icon:
      sprite: Markers/jobs.rsi
      state: prisoner
  - type: EscapeShuttleCondition

- type: entity
  parent: [BaseFugitiveObjective, BaseSurviveObjective]
  id: FugitiveExitObjective
  name: Prepare an exit
  description: They'll find you at some point. Get water, food, money, and way out off this station.
  components:
  - type: Objective
    icon:
      sprite: Markers/jobs.rsi
      state: prisoner
