- type: constructionGraph
  id: N14RugRecipes
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity
      edges:
        - to: n14RugBlue
          steps:
            - material: FloorCarpetBlue
              amount: 4
              doAfter: 2
        - to: n14RugPurple
          steps:
            - material: FloorCarpetPurple
              amount: 4
        - to: n14RugRed
          steps:
            - material: FloorCarpetRed
              amount: 4
              doAfter: 2
        - to: n14RugYellow
          steps:
            - material: FloorCarpetOrange
              amount: 4
              doAfter: 2

    - node: n14RugBlue
      entity: N14RugBlue
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CarpetBlue
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 1

    - node: n14RugPurple
      entity: N14RugPurple
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CarpetPurple
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 1

    - node: n14RugRed
      entity: N14RugRed
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: Carpet
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 1

    - node: n14RugYellow
      entity: N14RugYellow
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CarpetOrange # When we get yellow carpet !
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 1

