- type: constructionGraph
  id: MetalDetectorGraph
  start: start
  graph:
  - node: start
    edges:
    - to: metalDetector
      completed:
      - !type:SetAnchor
        value: true
      steps:
      - material: Plasteel
        amount: 10
      - material: Steel
        amount: 10
        doAfter: 5
      - material: Cable
        amount: 5
        doAfter: 8
  - node: frame
    entity: MachineFrame
    edges:
    - to: metalDetector
      conditions:
      - !type:EntityAnchored
      steps:
      - material: Plasteel
        amount: 5
        doAfter: 5
      - tool: Welding
        doAfter: 5

  - node: metalDetector
    entity: MetalDetector
