- type: constructionGraph
  id: StandingShelf
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity
      edges:
        - to: smallWoodStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 2
        - to: smallMetalStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: Steel
              amount: 3
              doAfter: 2
        - to: largeWoodStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 3
        - to: largeMetalStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
            - material: Steel
              amount: 4
              doAfter: 2
        - to: largeWoodDrawerStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
            - material: WoodPlank
              amount: 4
              doAfter: 3
        - to: metalStandingShelfMedical
          completed:
            - !type:SnapToGrid
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
            - material: Glass
              amount: 2
              doAfter: 2
            - material: Steel
              amount: 4
              doAfter: 3
        - to: metalStandingShelf
          completed:
            - !type:SnapToGrid
          steps:
            - material: Steel
              amount: 5
              doAfter: 2
        - to: fruitStand
          completed:
            - !type:SnapToGrid
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
            - material: WoodPlank
              amount: 4
              doAfter: 2
        - to: foodStand
          completed:
            - !type:SnapToGrid
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
            - material: Steel
              amount: 5
              doAfter: 3

## Deconstruction
# Small Shelves

    - node: smallWoodStandingShelf
      entity: SmallWoodStandingShelf
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
              prototype: MaterialWoodPlank1
              amount: 3
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 2

    - node: smallMetalStandingShelf
      entity: SmallMetalStandingShelf
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 3
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 2

