- type: entityTable
  id: UnknownShuttlesTableDeltaV
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: SyndicateRecruiter
    - id: SynthesisSpecialist
    - id: SyndicateArmsdealer
    - id: AsakimShuttle
    - id: HitmanShuttle
    - id: RoboNeuroticist
    - id: UnknownShuttleSyndieEvacPod

- type: entity
  parent: [BaseUnknownShuttleRule, BaseAntagGhostRoleRule]
  id: SyndicateRecruiter
  components:
  - type: StationEvent
    weight: 6
    minimumPlayers: 20
    maxOccurrences: 1
    duration: null
  - type: PrecognitionResult
    message: psionic-power-precognition-syndicate-recruiter-result-message
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_DV/Shuttles/Event/census.yml # Was /Maps/_DV/Shuttles/Admin/recruiter_ship.yml
  - type: AntagSpawner
    prototype: MobHuman
  - type: AntagObjectives
    objectives:
    - RecruiterEscapeObjective
    - RecruiterRecruitingObjective
    - RecruiterKeepPenObjective
  - type: AntagSelection
    agentName: recruiter-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SyndicateRecruiter

- type: entity
  parent: [BaseUnknownShuttleRule, BaseAntagGhostRoleRule]
  id: SynthesisSpecialist
  components:
  - type: StationEvent
    weight: 6
    minimumPlayers: 20
    maxOccurrences: 1
    duration: null
  - type: PrecognitionResult
    message: psionic-power-precognition-synthesis-specialist-result-message
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_DV/Shuttles/Event/synthesis_ship.yml
  - type: AntagSpawner
    prototype: MobHuman
  - type: AntagObjectives
    objectives:
    - SynthesisSurviveObjective
    - SynthesisPrescribeObjective
  - type: AntagSelection
    agentName: synthesis-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SynthesisSpecialist
      count: 2

- type: entity
  parent: [BaseUnknownShuttleRule, BaseAntagGhostRoleRule]
  id: SyndicateArmsdealer
  components:
  - type: StationEvent
    weight: 6
    minimumPlayers: 25
    maxOccurrences: 1
    duration: null
  - type: PrecognitionResult
    message: psionic-power-precognition-syndicate-armsdealer-result-message
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_DV/Shuttles/Event/strongbox.yml
  - type: AntagSpawner
    prototype: MobHuman
  - type: AntagObjectives
    objectives:
    - ArmsdealerSurviveObjective
    - ArmsdealerSaleObjective
  - type: AntagSelection
    agentName: armsdealer-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SyndicateArmsdealer
      count: 2

# Hitman (for the admeme spawn)
- type: entity
  parent: [BaseUnknownShuttleRule, BaseAntagGhostRoleRule]
  id: HitmanShuttle
  components:
  - type: StationEvent
    weight: 6
    minimumPlayers: 25
    maxOccurrences: 1
    duration: null
  - type: PrecognitionResult
    message: psionic-power-precognition-hitman-spawn-result-message
  - type: LoadMapRule
    gridPath: /Maps/_DV/Shuttles/Event/Professional.yml
  - type: AntagSpawner
    prototype: MobHuman
  - type: AntagObjectives
    objectives:
    - HitmanSurviveObjective
    - HitmanTeachLessonRandomPersonObjective
  - type: AntagRandomObjectives
    sets:
    - groups: HitmanObjectiveGroup
      maxPicks: 2 # i would rather it be tied to diffculty but if it wont assign a objective if it goes over difficulty this works
    maxDifficulty: 300
  - type: AntagSelection
    agentName: hitman-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: ShuttleHitman
