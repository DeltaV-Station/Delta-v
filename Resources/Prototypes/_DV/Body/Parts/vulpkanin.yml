- type: entity
  abstract: true
  parent: BasePart
  id: PartVulpkanin
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice #DynamicPrice
    price: 100
  - type: Tag
    tags:
      - Trash

- type: entity
  parent: [ PartVulpkaninBase, BaseTorso ]
  id: TorsoVulpkanin
  name: "vulpkanin torso"
  parent: PartVulpkanin
  components:
  - type: Sprite
    netsync: false
    sprite: _DV/Mobs/Species/Vulpkanin/parts.rsi
    state: "torso_m"
  - type: Icon
    sprite: _DV/Mobs/Species/Vulpkanin/parts.rsi
    state: "torso_m"
  - type: BodyPart
    partType: Torso

