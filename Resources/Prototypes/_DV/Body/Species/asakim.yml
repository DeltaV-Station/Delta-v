- type: markingsGroup
  id: Asakim
  onlyWhitelisted: true
  limits:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ LizardTailSmooth ]
    HeadTop:
      points: 2
      required: false
    HeadSide:
      points: 2 # WWDP-Edit
      required: false
    Chest:
      points: 3
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

