- type: markingsGroup
  parent: Undergarments
  id: Feroxi
  limits:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      points: 3
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FeroxiEars ]
    Snout:
      points: 1
      required: true
      defaultMarkings: [ FeroxiSnout ]
    Chest:
      points: 3
      required: false
    Arms:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ FeroxiTailAndDorsal ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFeroxi
  name: feroxi appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganFeroxiTorso
      Head: OrganFeroxiHead
      ArmLeft: OrganFeroxiArmLeft
      ArmRight: OrganFeroxiArmRight
      HandRight: OrganFeroxiHandRight
      HandLeft: OrganFeroxiHandLeft
      LegLeft: OrganFeroxiLegLeft
      LegRight: OrganFeroxiLegRight
      FootLeft: OrganFeroxiFootLeft
      FootRight: OrganFeroxiFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganFeroxiLungs
      Heart: OrganAnimalHeart
      Stomach: OrganFeroxiStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Feroxi

- type: entity
  parent: OrganBase
  id: OrganFeroxi
  abstract: true
  suffix: Feroxi

- type: entity
  parent: OrganFeroxi
  id: OrganFeroxiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Mobs/Species/Feroxi/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _DV/Mobs/Species/Feroxi/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Feroxi

