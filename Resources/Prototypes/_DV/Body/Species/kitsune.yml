- type: markingsGroup
  parent: Undergarments
  id: Kitsune
  limits:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ KitsuneTailDefault ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ KitsuneEarsDefault ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 4
      required: false
    Arms:
      points: 4
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKitsune
  name: kitsune appearance
  component:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandLeft: OrganHumanHandLeft
      HandRight: OrganHumanHandRight
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Ears: OrganHumanEars
      Appendix: OrganHumanAppendix
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Kitsune

- type: entity
  parent:
  - AppearanceKitsune
  - BaseSpeciesMobOrganic
  id: MobKitsune
  name: Urist McKitsune
  component:
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageContainer: BiologicalMetaphysical
    damageModifierSet: Kitsune
  - type: Speech
    speechSounds: Alto
    allowedEmotes: ['Growl', 'Squeak']
  - type: Vocal
    sounds:
      Male: MaleKitsune
      Female: FemaleKitsune
      Unsexed: MaleKitsune
  - type: TypingIndicator
    proto: kitsune
  - type: InteractionPopup
    interactSuccessString: petting-success-soft-floofy-kitsune
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/fox_squeak.ogg
  - type: Kitsune
  - type: PsionicBonusChance
    flatBonus: 0.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Items/hiss.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Heat: 5
  - type: LightweightDrunk
    boozeStrengthMultiplier: 3
  - type: PseudoItem
    storedOffset: "0,17"
    shape:
    - 0,0,1,4
    - 0,2,3,4
    - 4,0,5,4
