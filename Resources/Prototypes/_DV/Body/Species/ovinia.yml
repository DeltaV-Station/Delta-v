- type: markingsGroup
  id: Ovinia
  limits:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
    NeckFluff:
      points: 1
      required: false
    HeadTop:
      points: 2
      required: true
      defaultMarkings: [ OviniaEars ]
    Snout:
      points: 2
      required: false
    Chest:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    Arms:
      points: 4
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOvinia
  name: ovinia appearance
  components:
  - type: Inventory
    speciesId: ovinia
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: outerclothing_hardsuit
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganOviniaTorso
      Head: OrganOviniaHead
      ArmLeft: OrganOviniaArmLeft
      ArmRight: OrganOviniaArmRight
      HandRight: OrganOviniaHandRight
      HandLeft: OrganOviniaHandLeft
      LegLeft: OrganOviniaLegLeft
      LegRight: OrganOviniaLegRight
      FootLeft: OrganOviniaFootLeft
      FootRight: OrganOviniaFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganAnimalLungs
      Heart: OrganAnimalHeart
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganAnimalKidneys
  - type: HumanoidProfile
    species: Ovinia

- type: entity
  parent:
  - AppearanceOvinia
  - BaseSpeciesMobOrganic
  id: MobOvinia
  name: Urist McSheepy
  components:
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 215 # sheep be heavy
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Ovinia
  - type: Speech
    speechSounds: Alto
    speechVerb: Ovinia
  - type: Vocal
    sounds:
      Male: MaleOvinia
      Female: FemaleOvinia
      Unsexed: MaleOvinia
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - OviniaEmotes
  - type: ProtectedFromStepTriggers
  - type: TypingIndicator
    proto: ovinia
  - type: HumanoidAppearance
    species: Ovinia
  - type: Hunger
    baseDecayRate: 0.026 #25% slower than normal (chewin they cud)
  - type: Thirst
    baseDecayRate: 0.075 #25% slower than normal

- type: entity
  parent: OrganBase
  id: OrganOvinia
  suffix: ovinia

- type: entity
  parent: OrganOvinia
  id: OrganOviniaExternal
  components:
  - Sprite:
      sprite: _DEN/Mobs/Species/Ovinia/parts.rsi
  - VisualOrgan:
      date:
        sprite: _DEN/Mobs/Species/Ovinia/parts.rsi
  - VisualOrganMarkings:
      markingGroup:
        group: Ovinia
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: OrganOviniaTorso
  parent: [ OrganBaseTorso, OrganOviniaExternal ]
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganOviniaHead
  parent: [ OrganBaseHead, OrganOviniaExternal ]
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10
  categories: [ HideSpawnMenu ]

