# Head
- type: loadout
  id: CourierHead
  equipment:
      head: ClothingHeadCourier

- type: loadout
  id: MailCarrierHead
  equipment:
    head: ClothingHeadMailCarrier

# Jumpsuit
- type: loadout
  id: CourierJumpsuit
  equipment:
      jumpsuit: ClothingUniformCourier

- type: loadout
  id: CourierJumpskirt
  equipment:
      jumpsuit: ClothingUniformSkirtCourier

- type: loadout
  id: MailCarrierJumpsuit
  equipment:
    jumpsuit: ClothingUniformMailCarrier

- type: loadout
  id: MailCarrierJumpskirt
  equipment:
    jumpsuit: ClothingUniformSkirtMailCarrier

# OuterClothing
- type: loadout
  id: MailCarrierWintercoat
  equipment:
    outerClothing: ClothingOuterWinterCoatMail

# Backpack
- type: loadout
  id: ClothingBackpackClippy
  equipment:
      back: ClothingBackpackClippy
