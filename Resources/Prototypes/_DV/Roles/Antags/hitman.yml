- type: antag
  id: Hitman
  name: roles-antag-hitman-name
  objective: roles-antag-hitman-objective
  antagonist: true
  setPreference: true
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 24h # works for thief works for me

- type: antagSpecifier
  parent: RestrictedAntag
  id: BaseHitman
  name: hitman-round-end-agent-name
  allowNonHumans: true
  pickPlayer: true
  multiAntagSetting: NotExclusive
  startingGear: HitmanGear
  components:
  - type: AutoImplant
    implants:
    - HitmanCardImplant
  mindRoles:
  - MindRoleHitman
  briefing:
    text: hitman-role-greeting-human
    color: yellow
    sound: "/Audio/_DV/Ambience/Antag/hitman_briefing_piano_between.ogg"

- type: antagSpecifier
  parent: BaseHitman
  id: Hitman
  pickPlayer: false

- type: antagSpecifier
  parent: Hitman
  id: ShuttleHitman
  spawnerPrototype: SpawnPointGhostHitman
  roleLoadout:
  - RoleSurvivalStandard
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesFakeHumanFirst
    - NamesFakeHumanLast
    nameFormat: name-format-standard
  - type: RandomHumanoidAppearance
    randomizeName: false

- type: startingGear
  id: HitmanGear
  storage:
    back:
    - HitmanCase

- type: startingGear
  id: HitmanGhostGear
  equipment:
    jumpsuit: ClothingUniformHitmanSuit
    back: ClothingBackpackSatchel
    ears: ClothingHeadsetGreyHitman
    neck: ClothingNeckTieRed
    gloves: ClothingHandsGlovesLatex
    shoes: ClothingShoesBootsLaceup
    id: HitmanPDA
  storage:
    back:
    - HitmanCase
