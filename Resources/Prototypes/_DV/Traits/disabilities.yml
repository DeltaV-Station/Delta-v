## If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

- type: trait
  id: asd
  name: main trait
  description: the main trait
  category: Disabilities
  cost: 0
  subTraits:
    - asd1
    - asd2

- type: trait
  id: asd1
  name: first sub trait
  description: joe
  category: Disabilities
  cost: -1
  conditions:
    - !type:TraitDependencyCondition
      requires:
        - asd
  effects:
    - !type:AddCompsEffect
      components:
        - type: SomeComponent

- type: trait
  id: asd2
  name: second sub trait
  description: dirt dvd
  category: Disabilities
  cost: 2
  conditions:
    - !type:TraitDependencyCondition
      requires:
        - asd
      conflicts:
        - asd1
  effects:
    - !type:AddCompsEffect
      components:
        - type: SomeOtherComponent

- type: trait
  id: Blindness
  name: trait-blindness-name
  description: trait-blindness-desc
  category: Disabilities
  conditions:
  - !type:HasCompCondition
    component: Blindable
  effects:
  - !type:AddCompsEffect
    components:
    - type: PermanentBlindness
  - !type:SpawnItemInHandEffect
    item: WhiteCane

- type: trait
  id: PoorVision
  name: trait-poor-vision-name
  description: trait-poor-vision-desc
  category: Disabilities
  conditions:
  - !type:HasCompCondition
    component: Blindable
  effects:
  - !type:AddCompsEffect
    components:
    - type: PermanentBlindness
      blindness: 4
  - !type:SpawnItemInHandEffect
    item: ClothingEyesGlasses

