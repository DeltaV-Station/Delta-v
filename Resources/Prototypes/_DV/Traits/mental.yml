## If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

- type: trait
  id: Paracusia
  name: trait-paracusia-name
  description: trait-paracusia-desc
  category: Mental
  cost: 1
  effects:
  - !type:AddCompsEffect
    components:
    - type: Paracusia
      minTimeBetweenIncidents: 0.1
      maxTimeBetweenIncidents: 300
      maxSoundDistance: 7
      sounds:
        collection: Paracusia

- type: trait
  id: Depression
  name: trait-depression-name
  description: trait-depression-desc
  category: Mental
  cost: 1
  effects:
  - !type:SpawnItemInHandEffect
    item: PillCanisterNeurozenium

- type: trait
  id: Addicted
  name: trait-addicted-name
  description: trait-addicted-desc
  category: Mental
  cost: -3
  effects:
  - !type:AddCompsEffect
    components:
    - type: Addicted

- type: trait
  id: Liar
  name: trait-liar-name
  description: trait-liar-desc
  category: Mental
  cost: 1
  conditions:
  - !type:TraitDependencyCondition
    conflicts:
      - Muted
  effects:
  - !type:AddCompsEffect
    components:
    - type: ReplacementAccent
      accent: liar

- type: trait
  id: Pacifist
  name: trait-pacifist-name
  description: trait-pacifist-desc
  category: Mental
  cost: -4
  effects:
  - !type:AddCompsEffect
    components:
    - type: Pacified

# creator's barely disguised stamina system
