# This should be on every other fishing table
- type: entityTable
  id: BasicFishingLootTable
  table: !type:GroupSelector
    children:
    # 65% chance of scrap of some kind
    - !type:GroupSelector
      weight: 65 # DeltaV - 75 to 65%
      children:
      - !type:NestedSelector
        tableId: SalvageScrapLowValue
        weight: 90 # DeltaV - 65 to 90%
      - !type:NestedSelector
        tableId: SalvageScrapHighValue
        weight: 10 # DeltaV - 35 to 10%
    # 25% chance of some trash
    - !type:NestedSelector
      tableId: GenericTrashItems
      weight: 25 # DeltaV - 15 to 25%
    # 10% chance of low-value treasure or maintenance tools
    - !type:GroupSelector
      weight: 10
      children:
      - !type:NestedSelector
        tableId: SalvageTreasureCommon
      - !type:NestedSelector
        tableId: MaintToolsTable

# All types of the rare and unique fishes
- type: entityTable
  id: RareFishTable
  table: !type:GroupSelector
    children:
    - id: FishAlien
    - id: FishBingle
    - id: FishBoyFisher
    - id: FishNukeDisk
    - id: FishGib
    - id: FishMutant
    - id: FishNuker
    - id: FishToxic
    - id: FishIan
    - id: MobSpaceShrimp # DeltaV - shrimp attack!

# Fish from water
- type: entityTable
  id: WaterFishTable
  table: !type:GroupSelector
    children:
    - id: FishAngler
    - id: FishBass
    - id: FishBlob
    - id: FishBlueFintuna
    - id: FishCat
    - id: FishTropicalClown
    - id: FishPuffer
    - id: FishSilver
    - id: FishTropicalSun
    - id: FishTropical

# Items from Water
- type: entityTable
  id: WaterFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: BasicFishingLootTable
        weight: 40 # DeltaV - 70 to 40
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 50 # DeltaV - 20 to 50
      - !type:NestedSelector
        tableId: RareFishTable
        weight: 10

# Items from Lava
- type: entityTable
  id: LavaFishingLootTable
  table: !type:GroupSelector
    children:
      # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Plasma
- type: entityTable
  id: PlasmaFishingLootTable
  table: !type:GroupSelector
    children:
    # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Toilets
- type: entityTable
  id: ToiletFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: GenericTrashItems # DeltaV - changed BasicFishingLootTable to just trash to avoid salvage scrap and tools in perma
        weight: 60 # DeltaV - from 80 to 60
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 30 # DeltaV - changed from 20 to 30
      - !type:NestedSelector
        tableId: RareFishTable # DeltaV - add rare fish
        weight: 10
