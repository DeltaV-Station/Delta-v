- type: constructionGraph
  id: ThermomachineBoard
  start: freezer
  graph:
  - node: freezer
    entity: ThermomachineFreezerMachineCircuitBoard
    edges:
    - to: heater
      steps:
      - tool: Screwing
        doAfter: 2
  - node: heater
    entity: ThermomachineHeaterMachineCircuitBoard
    edges:
    - to: freezer
      steps:
      - tool: Screwing
        doAfter: 2
  - node: hellfirefreezer
    entity: HellfireFreezerMachineCircuitBoard
    edges:
    - to: hellfireheater
      steps:
      - tool: Screwing
        doAfter: 2
  - node: hellfireheater
    entity: HellfireHeaterMachineCircuitBoard
    edges:
    - to: hellfirefreezer
      steps:
      - tool: Screwing
        doAfter: 2
  # Begin DeltaV additions - kitchen freezer and sauna heater
  - node: kitchenfreezer
    entity: KitchenFreezerMachineCircuitBoard
    edges:
    - to: saunaheater
      steps:
      - tool: Screwing
        doAfter: 2
  - node: saunaheater
    entity: SaunaHeaterMachineCircuitBoard
    edges:
    - to: kitchenfreezer
      steps:
      - tool: Screwing
        doAfter: 2
  # End DeltaV additions
