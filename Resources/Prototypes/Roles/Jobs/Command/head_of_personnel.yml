- type: job
  id: HeadOfPersonnel
  name: job-name-hop
  description: job-description-hop
  playTimeTracker: JobHeadOfPersonnel
  antagAdvantage: 6 # DeltaV - Reduced TC: Head of Staff
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Epistemics # DeltaV
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Command
      time: 2.5h
  weight: 20
  startingGear: HoPGear
  icon: "JobIconHeadOfPersonnel"
  requireAdminNotify: true # DeltaV
  joinNotifyCrew: true # DeltaV
  whitelisted: true # DeltaV
  supervisors: job-supervisors-captain
  canBeAntag: false
  access:
  - Command
  - HeadOfPersonnel
  - Bar
  - Service
  - Maintenance
  - Janitor
  - Theatre
  - Kitchen
  - Chapel
  - Hydroponics
  - External
  - Cryogenics
  # I mean they'll give themselves the rest of the access levels *anyways*.
  # As of 15/03/23 they can't do that so here's MOST of the rest of the access levels.
  # Head level access that isn't their own was deliberately left out, get AA from the captain instead.
  - Chemistry
  - Engineering
  - Research
  - Detective
  - Salvage
  - Security
  #- Brig # DeltaV - We don't use it.
  - Lawyer
  - Cargo
  - Atmospherics
  - Medical
  - GenpopEnter
  - GenpopLeave
  # Begin DeltaV additions
  - Boxer
  - Clown
  - Mime
  - Musician
  - Reporter
  - Zookeeper
  - Mantis
  - Corpsman
  - Mail
  - Prosecutor
  - Robotics
  - Surgery
  - Psychologist
  - Paramedic
  - Clerk
  - Justice
  - Library
  # End DeltaV additions
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
  - !type:ModifyPsionicChanceSpecial # DeltaV - Command Roles are more likely to be psionic.
    jobBonusChance: 0.05 # Additional 5% chance.

- type: startingGear
  id: HoPGear
  equipment:
    #shoes: ClothingShoesLeather # DeltaV - Commented for Loadouts
    id: HoPPDA
    #gloves: ClothingHandsGlovesHop # DeltaV - Commented for Loadouts
    ears: ClothingHeadsetAltCommand
    belt: BoxFolderClipboardThreePapers
    eyes: ClothingEyesHudCommand
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: HeadOfPersonnelChameleonOutfit
  job: HeadOfPersonnel
  hasMindShield: true
  equipment:
    head: ClothingHeadHatHopcap
    eyes: ClothingEyesHudCommand
    mask: ClothingMaskNeckGaiterRed
