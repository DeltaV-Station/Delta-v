- type: entity
  parent: [ OrganBaseLungs, OrganThavenInternal, OrganHumanMetabolizer ]
  id: OrganThavenLungs
  description: "Technically not lungs since they don't draw chemicals from the air, these strange, durable organs use the motion of respiration to provide energy for cell maintenance."

- type: entity
  parent: [ OrganBaseHeart, OrganThavenInternal, OrganHumanMetabolizer ]
  id: OrganThavenHeart
  description: "The toxic heart of a thaven. You're wearing gloves, right?"

- type: entity
  parent: [ OrganBaseStomach, OrganThavenInternal, OrganHumanMetabolizer ]
  id: OrganThavenStomach
  description: "Surprisingly similar to the stomach of a sharkminnow."

- type: entity
  parent: [ OrganBaseLiver, OrganThavenInternal, OrganHumanMetabolizer ]
  id: OrganThavenLiver
