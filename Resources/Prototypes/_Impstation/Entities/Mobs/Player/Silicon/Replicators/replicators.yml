- type: entity
  name: replicator
  description: It's just a little guy. What harm could it do?
  id: BaseMobReplicator
  abstract: true
  parent: BaseMob
  components:
  - type: Puller
    needsHands: false
  - type: Replicator
  - type: NameIdentifier
    group: Replicator
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Replicator
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-replicator-name
    description: ghost-role-information-replicator-desc
    rules: ghost-role-information-replicator-rules
    mindRoles:
    - MindRoleReplicator
    raffle:
      settings: default
  - type: Sprite
    granularLayersRendering: true
    drawdepth: Mobs
    sprite: _Impstation/Mobs/Replicator/replicator.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
    - map: ["enum.ReplicatorVisuals.Combat"]
      state: combat_level1
      shader: unshaded
      visible: false
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
  - type: Appearance
  - type: ActionGrant
    actions:
    - ActionViewLaws
  - type: TypingIndicator
    proto: replicator
  - type: Speech
    speechVerb: Robotic
    speechSounds: Replicator
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
  - type: Emoting
  - type: DamagedSiliconAccent
  - type: ReplacementAccent
    accent: silicon
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
  - type: ActiveRadio
    channels:
    - Binary
  - type: Actions
  - type: ComplexInteraction
  - type: ProtectedFromStepTriggers
  - type: InputMover
  - type: MobMover
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - VimPilot
    - SiliconEmotes
    - Honker
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: GuideHelp
    guides:
    - Cyborgs
    - Robotics
  - type: Repairable
    damage:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
        Structural: -10
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 5
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Replicator1
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Structural
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Flashed
    - TemporaryBlindness
    - StaminaModifier
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: ZombieImmune
  - type: EmpResistance
    strengthMultiplier: 0
  - type: NpcFactionMember
    factions:
    - Replicator
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
    angle: 100
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Slashing: 7
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: Stamina
    baseCritThreshold: 120
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      groups:
        Brute: -0.5
        Burn: -0.5
      types:
        Shock: -0.5
        Structural: -0.5
  - type: ThermalVision
    lightRadius: 7
    color: "#d70aa0"
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer

- type: entity
  id: MobReplicatorQueen
  name: spore
  parent: BaseMobReplicator
  categories: [ HideSpawnMenu ]
  suffix: Queen
  components:
  - type: Replicator
    queen: true
  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: 0
  - type: Sprite
    granularLayersRendering: true
    drawdepth: SmallMobs
    sprite: _Impstation/Mobs/Replicator/replicator.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive_spore
    - map: ["enum.ReplicatorVisuals.Combat"]
      state: combat_level1
      shader: unshaded
      visible: false
  - type: Physics
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: MovementIgnoreGravity
    weightless: true
  - type: MovementAlwaysTouching
  - type: SyncSprite
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4.2
    weightlessFriction: 1
    weightlessFrictionNoInput: 2
    weightlessAcceleration: 1.8
  - type: NoSlip
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: NpcFactionMember
    factions:
    - Replicator

- type: entity
  id: MobReplicator
  parent: BaseMobReplicator
  categories: [ HideSpawnMenu ]
  components:
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
  - type: BorgChassis
    maxModules: 1
    hasMindState: robot_e
    noMindState: robot_e_r
    activateSound:
      path: /Audio/_Impstation/Misc/replicator_sfx1.ogg
    deactivateSound:
      path: /Audio/_Impstation/Misc/replicator_sfx2.ogg
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      borg_module: !type:Container { }
  - type: Replicator
    upgradeActions:
    - ActionReplicatorUpgrade2
    - ActionReplicatorUpgrade2Alt
  - type: CombatMode
  - type: StaminaDamageOnHit
    damage: 20
    sound: /Audio/Weapons/egloves.ogg
  - type: Physics
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: MovementIgnoreGravity
    weightless: true
  - type: MovementAlwaysTouching
  - type: SyncSprite
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4.2
    weightlessFriction: 1
    weightlessFrictionNoInput: 200
    weightlessAcceleration: 1.8
  - type: NoSlip
  - type: Sprite
    granularLayersRendering: true
    drawdepth: SmallMobs
    sprite: _Impstation/Mobs/Replicator/replicator.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
    - map: ["enum.ReplicatorVisuals.Combat"]
      state: combat_level1
      shader: unshaded
      visible: false
  - type: ContainerFill
    containers:
      borg_module:
      - ReplicatorModuleT1
  - type: NpcFactionMember
    factions:
    - Replicator

