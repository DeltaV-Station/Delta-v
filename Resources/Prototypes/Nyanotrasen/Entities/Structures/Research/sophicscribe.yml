- type: entity
  parent: BaseStructure
  id: SophicScribe
  name: sophic grammateus
  description: Latest reports on the Noösphere!
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    offset: "0.0,0.5"
    sprite: _DV/Structures/Decoration/statues.rsi
    layers:
      - state: sophie
      - map: ["enum.SolutionContainerLayers.Fill"]
  - type: SophicScribe
  - type: Speech
    speechSounds: Tenor
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Common
    - Science
  - type: ActiveRadio
    channels:
    - Common
    - Science
  - type: Psionic
  - type: Grammar
    attributes:
      gender: female
      proper: true
  - type: SpriteFade
  - type: GuideHelp
    guides:
    - Psionics

- type: npcConversationTree
  id: SophiaTree
  dialogue:
  - prompts: [glimmer, reading, psi]
    responses:
    - is: !type:NPCConversationGetGlimmerEvent
        text: sophia-response-glimmer

  - prompts: [purpose, job, occupation, profession, role]
    weight: 0.5
    responses:
    - text: sophia-response-job

  - prompts: [help, topics]
    weight: 0.5
    hidden: true
    responses:
    - is: !type:NPCConversationHelpEvent
        text: sophia-response-help

  - prompts: [nature, statue, being]
    weight: 0.3
    responses:
    - text: sophia-response-nature

  - prompts: [Absence, Dormancy, "Period of Silence"] #Attempt at lore on why she never spoke since rebase
    weight: 0.3
    responses:
    - text: sophia-response-absence

  - prompts: [epistemics, epi]
    weight: 0.2
    responses:
    - text: sophia-response-epi

  - prompts: [mantis]
    weight: 0.2
    responses:
    - text: sophia-response-mantis

  - prompts: [mystagogue, mysta]
    weight: 0.2
    responses:
    - text: sophia-response-mystagogue

  - prompts: [psionics, psychic]
    weight: 0.2
    responses:
    - text: sophia-response-psionics

  - prompts: [noösphere, noosphere]
    weight: 0.2
    responses:
    - text: sophia-response-noosphere

  - prompts: [cloning, clones, reincarnation, death, dying, afterlife]
    weight: 0.2
    responses:
    - text: sophia-response-cloning

  - prompts: [calendar, date]
    weight: 0.2
    responses:
    - text: sophia-response-calendar

  - prompts: [morphotypes, morphotype, species]
    weight: 0.2
    responses:
    - text: sophia-response-morphotype

  - prompts: [gods, god]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-god

  - prompts: [truth, "true", "false", falsity, falsehood]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-truth

  - prompts: [human, humans, humanoid]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-human

  - prompts: [felinid, felinids, felid, felids, catperson, catpeople]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-felinid

  - prompts: [oni, onis]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-oni

  - prompts: [arachne, arachnid, arachnids, spiderperson, spiderpeople]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-arachne

  - prompts: [moth, moths, moff, moths, mothpeople, mothperson]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-moth

  - prompts: [lamiae, lamia, lamias, snakepeople, snakeperson]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-lamiae

  - prompts: [grue, grues, batperson, batpeople]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-grue

  - prompts: [mushpeople, fungipeople] #Was originally something else, but I had zero clue as to what that race was. There was literally no mention of it in prebase code. I just replaced it with something more recognizable to those who have studied the ancient code of prebase.
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-mushpeople

  - prompts: [crisis, causality, incident]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-crisis

  - prompts: [oracle]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-oracle

  - prompts: ["The Unknown", "Cosmic God", "Bringer of The Curtains Fall", "Cosmic Cult"] #Might as well since its no longer metashielded
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-theunknown

  - prompts: ["Goddess of Slaughter", "Blood Goddess", "Goddess of Blood", Narsie]
    weight: 0.1
    responses:
    - text: sophia-response-narsie

  - prompts: ["Lord of Time", "Lord of Progress", "God of Time", "God of Progress", Ratvar]
    weight: 0.1
    responses:
    - text: sophia-response-ratvar

  - prompts: ["Goddess of Humor", "Goddess of Chaos", "Chaos Goddess", "Clown Goddess", Honkmother]
    weight: 0.1
    responses:
    - text: sophia-response-honkmother

  - prompts: [hi, hello, hey, greetings, salutations, yo]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-hello-1
    - text: sophia-response-hello-2

  - prompts: [bye, goodbye, done, farewell, later, seeya, godspeed]
    weight: 0.1
    hidden: true
    responses:
    - text: sophia-response-bye-1
      event: !type:NPCConversationByeEvent
    - text: sophia-response-bye-2
      event: !type:NPCConversationByeEvent
    - text: sophia-response-bye-3
      event: !type:NPCConversationByeEvent
    - text: sophia-response-bye-4
      event: !type:NPCConversationByeEvent

  attention:
  - text: sophia-response-attention-1
  - text: sophia-response-attention-2
  - text: sophia-response-attention-3

  idle:
  - text: sophia-idle-phrase-1
  - text: sophia-idle-phrase-2
  - text: sophia-idle-phrase-3

  unknown:
  - text: sophia-response-sorry-1
  - text: sophia-response-sorry-2
  - text: sophia-response-sorry-3
