- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterArmorGladiator
  name: gladiator armor
  description: A good old set of boiled leather armor fit with buckles, belts, and a decorated pauldron. Are you not entertained?
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/gladiator.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/gladiator.rsi
  - type: Armor
    modifiers:
      armor:
        Blunt: DamageUnarmed
        Slash: DamageUnarmed
        Piercing: DamageUnarmed

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterArmorKendoBogu
  name: bogu
  description: A set of armor used in Kendo. It covers the waist, torso, and hands. 
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/bogu.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/bogu.rsi
  - type: Armor
    modifiers:
      armor:
        Blunt: DamageTider
        Slash: DamageUnarmed
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.85
    
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterArmorTouseiGusoku
  name: tousei-gusoku
  description: A modern replica of a Ni-mai-do Gusoku armor set. 
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/touseigusoku.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/OuterClothing/Armor/touseigusoku.rsi
  - type: Armor
    modifiers:
      armor:
        Blunt: DamageTider
        Slash: DamagePistol
        Piercing: DamageTider
        