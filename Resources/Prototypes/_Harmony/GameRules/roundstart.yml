- type: entity
  parent: BaseGameRule
  id: ThiefChance
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5

- type: entity
  parent: BaseGameRule
  id: Conspirators
  components:
  - type: GameRule
    minPlayers: 15 # DeltaV - changed from 28 to 15
    minTotalPlayers: 40 # DeltaV - added attribute
    delay: # DeltaV - add delay to make sure as many people as possible join the round
      min: 600
      max: 900
  - type: ConspiratorRule
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Conspirator
      range:
        min: 4
        max: 7