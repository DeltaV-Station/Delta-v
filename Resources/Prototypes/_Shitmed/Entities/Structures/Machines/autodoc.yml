# Autodocs

- type: entity
  parent: [ConstructibleMachine, BaseMachinePowered]
  id: Autodoc
  name: Autodoc Mk.XIV
  description: A programmable robotic surgeon capable of automatically operating on patients.
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/autodoc.rsi
    layers:
    - state: idle
  - type: Hands
  - type: HandsFill
    hands:
      multitool: OmnimedToolAutodoc
      surgery_specific: null
  - type: WiresPanel
  - type: Wires
    layoutId: Autodoc # do it, snip the safety wire :godo:
    boardName: wires-board-name-autodoc
  - type: Machine
    board: AutodocCircuitboard
  - type: Construction
    graph: Machine
    node: machine
    containers:
     - machine_board
     - machine_parts
     - storagebase
  - type: EmptyOnMachineDeconstruct
    containers:
    - surgery_specific
    - storagebase
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
        showEnts: False
        occludes: True
        ents: []
      machine_parts: !type:Container
        showEnts: False
        occludes: True
        ents: []
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: AutomationSlots #Goobstation Factorio
    slots:
    - !type:AutomatedStorage
      input: AutomationSlotStorage
      output: AutomationSlotStorage
    - !type:AutomatedHand
      input: AutomationSlotAutodocHand
      output: AutomationSlotAutodocHand
      handName: surgery_specifi
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - OperatingTableReceiver
  - type: UserInterface
    interfaces:
      enum.AutodocUiKey.Key:
        type: AutodocBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.AutodocUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: Autodoc
  - type: Sanitized # DeltaV
  - type: SurgerySelfDirty # DeltaV
  - type: DoAfter # Required for it to do surgery
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Storage
    clickInsert: false # incredibly annoying
    openOnActivate: false # DeltaV - also annoying
    maxItemSize: Large # DeltaV - fit arm augments
    grid:
    - 0,0,3,3
  - type: SurgerySpeedModifier
    speedModifier: 4 # DeltaV - Surgeons with surgical gloves and advanced tools have the speed of 3.
  - type: GuideHelp
    guides: [ Autodoc ]

- type: entity
  parent: Autodoc
  id: AutodocSyndie
  # TODO: make it valid
  suffix: Syndie
  components:
  # Begin DeltaV Additions
  - type: Sprite
    sprite: _DV/Structures/Machines/syndie_autodoc.rsi
  - type: Autodoc
    requireSleeping: false
  # End DeltaV Additions
  - type: Machine
    board: AutodocSyndieCircuitboard

# Autodoc tools

- type: entity
  parent: OmnimedTool
  id: OmnimedToolAutodoc
  suffix: Unremoveable
  components:
  - type: Unremoveable
  # Begin DeltaV Additions - Setting all these to 1 allows to easier fine tune Autodoc speed by its value. Otherwise, the tool doubles the autodoc's speed.
  - type: Hemostat
    speed: 1
  - type: Scalpel
    speed: 1
  - type: Drill
    speed: 1
  - type: BoneSetter
    speed: 1
  - type: Retractor
    speed: 1
  - type: Cautery
    speed: 1
  - type: BoneGel
    speed: 1
  - type: BoneSaw
    speed: 1
  - type: Tweezers
    speed: 1
  - type: Tending
    speed: 1
  # End DeltaV Additions
