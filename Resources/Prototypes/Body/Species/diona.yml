      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 1
      required: true
      default: [ DionaVineOverlay ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDiona
  name: diona appearance
  components:
  - type: Inventory
    templateId: diona
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganDionaTorso
      Head: OrganDionaHead
      ArmLeft: OrganDionaArmLeft
      ArmRight: OrganDionaArmRight
      HandRight: OrganDionaHandRight
      HandLeft: OrganDionaHandLeft
      LegLeft: OrganDionaLegLeft
      LegRight: OrganDionaLegRight
      FootLeft: OrganDionaFootLeft
      FootRight: OrganDionaFootRight
      Brain: OrganDionaBrainNymphing
      Eyes: OrganDionaEyes
      Lungs: OrganDionaLungsNymphing
      Stomach: OrganDionaStomachNymphing
  - type: HumanoidProfile
    species: Diona

- type: entity
  parent:
  - AppearanceDiona
  - BaseSpeciesMobOrganic
  id: MobDiona
  name: Urist McPlants
  components:
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Hunger
    baseDecayRate: 0.0083
  - type: Thirst
    baseDecayRate: 0.0083
  - type: Damageable
    damageModifierSet: Diona
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#cd7314"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeatPlant
        amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sap
        Quantity: 300
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
    - reagents: [ PlantBGone ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: 0.05
            Slash: 0.05
            Piercing: 0.075
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "diona-hurt-by-herbicide-popup" ]
        probability: 0.66
    - reagents: [ WeedKiller ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.125
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "diona-hurt-by-herbicide-popup" ]
        probability: 0.66
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300 #weighs more than humans because wood
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Speech
    speechVerb: Plant
    allowedEmotes: ['Chirp']
  - type: Vocal
    sounds:
      Male: UnisexDiona
      Female: UnisexDiona
      Unsexed: UnisexDiona
  - type: TypingIndicator
    proto: diona
  - type: BodyEmotes
    soundsId: DionaBodyEmotes
  - type: IgnoreKudzu
  - type: IgniteOnHeatDamage
    fireStacks: 1
    threshold: 12
  # Begin DeltaV Changes - gib at will
  # - type: GibAction
  #   actionPrototype: DionaGibAction
  #   allowedStates:
  #   - Alive
  #   - Critical
  #   - Dead
  - type: DVNymphingBody
  - type: ActionGrant
    actions:
    - DVDionaGibAction
  # End DeltaV Changes - gib at will
  - type: Rootable
  - type: MovementSpeedModifier # DeltaV
    baseWalkSpeed: 1.0
    baseSprintSpeed: 3.0
  - type: FTLKnockdownImmune # Frontier
  - type: LightReactive # DeltaV
    manual: true
  - type: LightLevelHealth # DeltaV
    darkThreshold: 0.4
    lightThreshold: 1.2
    darkDamage:
      types:
        Heat: 1.0
    lightDamage:
      types:
        Blunt: -0.1
        Piercing: -0.1
        Slash: -0.1
        Heat: -0.1
        Poison: -0.1
        Asphyxiation: -0.1
    darkMovementSpeedMultiplier: 0.7
  # DeltaV additions - add rootsong
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Rootsong
  - type: ActiveRadio
    channels:
    - Rootsong
  # DeltaV changes end

