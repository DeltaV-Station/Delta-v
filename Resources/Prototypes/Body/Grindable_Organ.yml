#Begin Delta-V Additions
- type: entity
  id: OrganGrindable
  name: OrganGrindable
  abstract: true
  components:
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 15
        reagents:
          - ReagentId: Proteins
            Quantity: 10

- type: entity
  parent: OrganGrindable
  id: OrganGrindableBrain
  name: GrindableBrain
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 20
        reagents:
          - ReagentId: Proteins
            Quantity: 15
          - ReagentId: GreyMatter
            Quantity: 5
- type: entity
  parent: OrganGrindable
  id: OrganGrindableEyes
  name: OrganGrindableEyes
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      organ:
         maxvol: 7
         reagents:
           - ReagentId: Water
             Quantity: 3
           - ReagentId: Blood
             Quantity: 2
           - ReagentId: Protein
             Quantity: 2

- type: entity
  parent: OrganGrindable
  id: OrganGrindableTongue
  name: GrindableTongue
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
        organ:
          maxvol: 10
          reagents:
            - ReagentId: Blood
              Quantity: 2
            - ReagentId: Protein
              Quantity: 8

- type: entity
  parent: OrganGrindable
  id: OrganGrindableAppendix
  name: GrindableAppendix
  abstract: true

- type: entity
  parent: OrganGrindable
  id: OrganGrindableEars
  name: GrindableEars
  abstract: true

- type: entity
  parent: OrganGrindable
  id: OrganGrindableLungs
  name: OrganGrindableLungs
  abstract: true
  components:
  - type: Lung
  - type: Metabolizer
    stages: [ Respiration ]
  - type: SolutionContainerManager
    solutions:

      Lung:
        maxVol: 100.0
        canReact: false

- type: entity
  parent: OrganGrindable
  id: OrganGrindableHeart
  name: GrindableHeart
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      organ:
        maxvol: 20
        reagents:
          - ReagentId: Blood
            Quantity: 8
          - ReagentId: Protein
            Quantity: 12

- type: entity
  parent: OrganGrindable
  id: OrganGrindableStomach
  name: GrindableStomach
  abstract: true
  components:
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 25
        reagents:
        - ReagentId: Proteins
          Quantity: 25
      stomach:
        maxVol: 50

- type: entity
  parent: OrganGrindable
  id: OrganGrindableLiver
  name: GrindableLiver
  abstract: true

- type: entity
  parent: OrganGrindable
  id: OrganGrindableKidneys
  name: GrindableKidneys
  abstract: true



