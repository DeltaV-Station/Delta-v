- type: entity
  name: base shield
  parent: BaseItem
  id: BaseShield
  description: A shield!
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/shields.rsi
      state: icon
      #state: riot-icon #Harmony Change: Replaced with a more suitable state due to being redudant
    - type: Item
      sprite: Objects/Weapons/Melee/shields.rsi
      size: Ginormous
      #heldPrefix: riot #Harmony Change: Removed due to being redundant
    - type: Blocking
      # Begin DeltaV
      passiveBlockModifier:
        armor:
          Blunt: DamageUnarmed
          Slash: DamageUnarmed
          Piercing: DamageUnarmed
          Heat: DamageUnarmed
      activeBlockModifier:
        armor:
          Blunt: DamageTider
          Slash: DamageTider
          Piercing: DamageTider
          Heat: DamageTider
      # End DeltaV
    - type: Damageable
      damageContainer: Shield
    - type: ExaminableDamage
      messages: ShieldMessages
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 140
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100 #This is probably enough damage before it breaks
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel:
                  min: 2
                  max: 2
                SheetGlass:
                  min: 2
                  max: 2
    - type: StaticPrice
      price: 100
    # Begin DeltaV additions
    - type: MeleeWeapon
      canWideSwing: false
      damage:
        types:
          Blunt: 3
      soundHit:
        collection: MetalThud
      bluntStaminaDamageFactor: 1.5
    # End DeltaV additions

- type: entity
  name: base repairable shield
  parent: BaseShield
  id: BaseRepairableShield
  description: A repairable shield!
  abstract: true
  components:
  - type: Repairable # Negative values represent healing
    damage:
      groups:
        Brute: -60 # 20 of each Brute Type - 20% of a basic shield HP
      types:
        Heat: -20
    fuelCost: 10 # 1/2 of a Welder for a full repair
    doAfterDelay: 5
    allowSelfRepair: false

