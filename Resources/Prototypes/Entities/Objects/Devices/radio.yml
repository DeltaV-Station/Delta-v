- type: entity
  name: handheld radio
  description: A handy handheld radio.
  parent: BaseItem
  id: RadioHandheld
  components:
  - type: Appearance # DeltaV - Give the radio visual states for on/off microphone and speaker
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    toggleOnInteract: true # DeltaV - Only microphone toggles by primary interation
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: Speech
    speechVerb: Robotic
  # BEGIN DeltaV - Give the radio visual states for on/off microphone and speaker
  - type: Sprite
    sprite: _DV/Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie-off
    - state: walkietalkie-broadcasting
      map: ["broadcasting"]
      shader: unshaded
      visible: false
    - state: walkietalkie-speaker
      map: ["speaker"]
      shader: unshaded
      visible: false
#    state: walkietalkie
  - type: Item
    sprite: _DV/Objects/Devices/communication.rsi
    heldPrefix: walkietalkie-off
  # END DeltaV
  - type: Tag
    tags:
    - Radio
  - type: DVRadioVisuals # DeltaV - Give the radio visual states for on/off microphone and speaker
    microphoneSpriteLayer: broadcasting
    speakerSpriteLayer: speaker
    microphoneInhandVisuals:
      left:
      - state: walkietalkie-broadcasting-inhand-left
        shader: unshaded
      right:
      - state: walkietalkie-broadcasting-inhand-right
        shader: unshaded
    speakerInhandVisuals:
      left:
      - state: walkietalkie-speaker-inhand-left
        shader: unshaded
      right:
      - state: walkietalkie-speaker-inhand-right
        shader: unshaded

- type: entity
  name: security radio
  description: A handy security radio.
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  components:
  - type: RadioMicrophone
    broadcastChannel: Security
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Sprite
    sprite: _DV/Objects/Devices/securityhandy.rsi # DeltaV - resprite security radio
    layers:
    # BEGIN DeltaV - Give the radio visual states for on/off microphone and speaker
    - state: walkietalkie-off
    - state: walkietalkie-broadcasting
      map: [ "broadcasting" ]
      shader: unshaded
      visible: false
    - state: walkietalkie-speaker
      map: [ "speaker" ]
      shader: unshaded
      visible: false
    # END DeltaV
  - type: Item
    sprite: _DV/Objects/Devices/securityhandy.rsi # DeltaV - resprite security radio
    heldPrefix: walkietalkie-off
