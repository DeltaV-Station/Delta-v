- type: entity
  parent: [ FoodBakedCroissant, ThrowingKnife ]
  id: WeaponCroissant
  suffix: Weapon
  components:
  - type: Item
    sprite: null # Should be removed if croissant receives an inhand sprite
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: LandAtCursor
  - type: DamageOtherOnHit
    ignoreResistances: true
    damage:
      types:
        Slash: 5
        Piercing: 10
  - type: ThrowingAngle
    angularVelocity: true # spins
