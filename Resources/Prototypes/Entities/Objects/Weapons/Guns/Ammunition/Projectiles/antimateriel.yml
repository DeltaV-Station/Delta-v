- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletAntiMateriel
  name: bullet (.60 anti-materiel)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 55 # DeltaV - was 75, reduced due to AP
        Structural: 70 # DeltaV - was 226
    ignoreResistances: true # DeltaV - Hristov be spooky now
    penetrationThreshold: 360
    penetrationDamageTypeRequirement:
    - Structural
  - type: StaminaDamageOnCollide
    damage: 60
  - type: PiercingProjectile # DeltaV - pierces up to 3 walls/windows
    pierceCounterWhitelist:
      tags:
      - Wall
      - Window
    maxPierceNumberThreshold: 3 # this seems to not work
    healthThreshold: 200 # Normal walls have a threshold of 200.
