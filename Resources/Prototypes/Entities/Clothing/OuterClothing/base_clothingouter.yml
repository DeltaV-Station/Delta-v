- type: entity
  abstract: true
  parent: Clothing
  id: ClothingOuterBase
  components:
  - type: Clothing
    slots:
    - outerClothing
  - type: Sprite
    state: icon
  - type: AllowSuitStorage # DeltaV - allow suit storage for all outer clothing, no whitelist
  # Funky Start - Clothing stains.
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Funkystation/Effects/blood.rsi
        state: outerclothing
    iconVisuals:
    - sprite: _Funkystation/Effects/blood.rsi
      state: outerclothing
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
      stain:
        maxVol: 5
  - type: StainBlocker
    slots: [INNERCLOTHING]
  # Funky End - Clothing stains.

- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingOuterBaseLarge
  components:
  - type: Item
    size: Huge
  - type: Clothing
    slots:
    - outerClothing
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: Tag
    tags:
      - WhitelistChameleon
  # Funky Start - Clothing stains.
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Funkystation/Effects/blood.rsi
        state: suitblood
    iconVisuals:
    - sprite: _Funkystation/Effects/blood.rsi
      state: suitbloodicon
  - type: StainBlocker
    slots: [INNERCLOTHING]
  # Funky End - Clothing stains.

- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingOuterStorageBase
  components:
  - type: Storage
    grid:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: StaticPrice
    price: 70
  # Funky Start - Clothing stains.
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Funkystation/Effects/blood.rsi
        state: coatblood
    iconVisuals:
    - sprite: _Funkystation/Effects/blood.rsi
      state: coatbloodicon
  # Funky End - Clothing stains.

- type: entity
  abstract: true
  parent: [ClothingOuterStorageBase, BaseFoldable]
  id: ClothingOuterStorageFoldableBase
  components:
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedHeldPrefix: open
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-open
      map: ["foldedLayer"]
      visible: false
  # Funky Start - Clothing stains.
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Funkystation/Effects/blood.rsi
        state: outerclothing
    iconVisuals:
    - sprite: _Funkystation/Effects/blood.rsi
      state: outerclothing
  # Funky End - Clothing stains.

- type: entity
  abstract: true
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterStorageFoldableBaseOpened
  suffix: opened
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: open
  - type: Item
    heldPrefix: open
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
      visible: false
    - state: icon-open
      map: ["foldedLayer"]
      visible: true

- type: entity
  abstract: true
  parent: ClothingOuterStorageBase
  id: ClothingOuterStorageToggleableBase
  components:
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodWinterDefault
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      toggleable-under-clothing: !type:ContainerSlot {} # DeltaV - Allow hats under toggleable clothing
      storagebase: !type:Container
        ents: []

- type: entity
  abstract: true
  parent: [ClothingOuterBase, GeigerCounterClothing, AllowSuitStorageClothing]
  id: ClothingOuterHardsuitBase
  name: base hardsuit
  components:
# SlotBlocker blocked until UI change
#  - type: SlotBlock
#    slots: [innerclothing, feet]
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: HeldSpeedModifier
  - type: Item
    size: Ginormous
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.90
        Radiation: 0.25
  - type: ToggleableClothing
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      toggleable-under-clothing: !type:ContainerSlot {} # DeltaV - Allow hats under toggleable clothing
  - type: GroupExamine
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
    - HidesHarpyWings # DeltaV: Used by harpies to help render their hardsuit sprites
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # the average lightbulb only does around four damage!
    slots: OUTERCLOTHING
  - type: HideLayerClothing
    slots:
    - Tail
  - type: CosmicTransmutable # DeltaV
    transmutesTo: ClothingOuterHardsuitCosmicCult
    requiredGlyphType: CosmicGlyphWarding
  - type: StainBlocker # Funky - Clothing stains.
    slots: [INNERCLOTHING, FEET, GLOVES]

- type: entity
  abstract: true
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: ClothingOuterEVASuitBase
  name: base EVA Suit
  components:
# SlotBlocker blocked until UI change
#  - type: SlotBlock
#    slots: [innerclothing, feet]
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01 # Not complete protection from fire
    coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: Item
    size: Huge
  - type: Tag # DeltaV - Harpy Wings with Hardsuit
    tags:
    - HidesHarpyWings
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # the average lightbulb only does around four damage!
    slots: OUTERCLOTHING
  - type: HideLayerClothing
    slots:
    - Tail
  - type: CosmicTransmutable # DeltaV
    transmutesTo: ClothingOuterHardsuitCosmicCult
    requiredGlyphType: CosmicGlyphWarding
  - type: StainBlocker # Funky - Clothing stains.
    slots: [INNERCLOTHING, FEET, GLOVES]

